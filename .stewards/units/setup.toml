[doc]
overview = "The setup unit is how a repository gets onto stewards and how the generated files stay true. It proposes units for a repo and writes .stewards, writes the stewards block into AGENTS.md, tells each agent harness how to delegate, and renders human documentation pages from the unit cards. A reader meets it as three commands, init, guide and docs, plus the harness table that guide and init draw on."
how_it_works = "Plain init (src/init.rs, propose) refuses with already_initialized if units.toml or repo.toml exists. Otherwise it proposes units from manifest roots, source directories and co-change history, naming the repo after its origin remote (the last URL segment without .git), else its directory. It writes both files, appends the .gitignore lines that are missing (a line with or without a leading or trailing slash counts as present), upserts the AGENTS.md block, and reports the units, unowned files and paths written. init --draft (draft_jobs) runs only the first step on an uninitialized repo and then briefs jobs: one architect job to name the units, plus a first-review job for each never-reviewed unit. With --direct it checks every model guard first, then calls and submits each job itself; if one fails it reports how many were already submitted. init --hooks and init --ci return not_implemented. The AGENTS.md block comes from src/guide.rs: upsert_block writes it at the top of the file (creating the file) or replaces the text between the existing start and end markers, and returns whether the file changed, so a rerun is a no-op. guide's run prints the block's paragraphs plus delegation text for the harness forced with --harness or detected, else generic text; --all adds every harness, --errors the error table, --glossary the glossary. src/harness.rs holds the facts table: detect returns the first harness whose env var prefix matches the environment (a harness with an unverified env rule is never detected), and by_name looks one up case-insensitively, failing with harness_unknown and the list of valid names. src/docs.rs (pages) renders docs_path/<unit>.md for one or all units, plus README.md, from the cards, tests and repo.toml. It escapes card text, links live anchors, rejects an empty docs_path or one that escapes the repo, rejects an unknown unit, and writes only files whose content changed. Its run uses the shared workspace and unit lookups."
how_to_change = "Start from the file for the command: src/init.rs for proposing units and draft jobs, src/guide.rs for the AGENTS.md block and guide text, src/harness.rs for per-harness facts, src/docs.rs for rendered pages. Each has a test file in tests/ (init.rs, init_draft.rs, guide.rs, docs.rs); change the test with the behavior. Keep true what the contracts promise: plain init never overwrites an initialized repo; init --draft only runs on an uninitialized repo and checks every model guard before any --direct call; the .gitignore step only appends and never duplicates a line already there in another spelling; upsert_block stays idempotent and touches only the text between its markers; a harness is only detected when its env rule is verified, and an unknown name stays harness_unknown with the valid names; docs refuses a docs_path that is empty or escapes the repo and rewrites only changed files. Look up the repo, its cards and a unit through the shared helpers rather than writing a local copy. Keep the card's interface table in step when a contract changes."
