# The small three-language fixture (`evals/fixture/`, about 400 lines). `arms.sh`
# copies it for each arm; the `full` arm is `stewards init`, the hand-set units,
# then an adoption session.
tasks_dir = "tasks"
session_minutes = 30

[source]
kind = "fixture"
dir = "fixture"
units = "full-units.toml"
unowned = [".gitignore", "AGENTS.md"]
tests = ["api/test_*.py", "client/*.test.ts", "cli/tests/**"]

# Each unit's own test command, run from the repo root as the fixture's tests are: `init` finds
# only cli's (its Cargo manifest), and the root has no toolchain, so no repo-wide command.
[source.test_commands]
api = "python3 -m unittest discover -s api"
client = "node --test client/"
cli = "cargo test --manifest-path cli/Cargo.toml"

[[task]]
number = 1

[[task]]
number = 2

[[task]]
number = 3

[[task]]
number = 4
read_only = true

[[task]]
number = 5

[[task]]
number = 6
read_only = true
setup = 5
files_opened_vs_bare = 4
