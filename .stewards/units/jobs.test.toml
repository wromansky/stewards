unit = "jobs"

[[scenario]]
id = "submit-retires-own-answer"
interface = "submit-file"
given = "a maintainer job whose answer file is the brief's own .answer.json"
expect = "a successful submit removes the brief and that answer; a second submit is no_brief"
level = "integration"
command = "cargo test --test submit a_second_submit_after_success_is_no_brief"

[[scenario]]
id = "submit-keeps-foreign-answer"
interface = "submit-file"
given = "a maintainer job submitted with --file pointing at an answer outside the brief's own path"
expect = "the submit succeeds, the brief is removed, the caller's answer file is kept"
level = "integration"
command = "cargo test --test submit an_answer_file_from_outside_the_briefs_dir_is_kept"

[[scenario]]
id = "submit-keeps-answer-on-failure"
interface = "submit-file"
given = "a maintainer answer the validator rejects"
expect = "the brief and the answer both remain for a retry"
level = "integration"
command = "cargo test --test submit dead_anchor_is_rejected_and_writes_nothing"

[[scenario]]
id = "submit-rejects-keyword-anchor-name"
interface = "submit-file"
given = "a maintainer card patch whose anchor names carry a keyword such as `def create_item`"
expect = "answer_parse_failed naming each of interface[].anchor, anchors[].name and gaps[].anchor"
level = "integration"
command = "cargo test --test submit anchor_name_with_a_keyword_is_rejected_naming_each_field"

[[scenario]]
id = "submit-rejects-keyword-flow-entry"
interface = "submit-file"
given = "an architect flow whose entry anchor carries a keyword"
expect = "answer_parse_failed on flows[0].entry and no write"
level = "integration"
command = "cargo test --test submit_roles architect_flow_entry_with_a_keyword_is_rejected"

[[scenario]]
id = "developer-submit-retires-answer"
interface = "submit-file"
given = "a developer job submitted from its own answer file"
expect = "the brief and the answer are removed; card, stamp and task list are unchanged"
level = "integration"
command = "cargo test --test developer a_developer_submit_leaves_the_card_stamp_and_task_list_unchanged"

[[scenario]]
id = "submit-patch-upserts-by-key"
interface = "submit-file"
given = "a maintainer card patch listing one interface entry whose id is new, and one whose id the card has"
expect = "the new entry is appended, the existing one is updated in place, every other entry keeps its order and content"
level = "integration"
command = "cargo test --test submit one_entry_updates_it_and_keeps_the_others_unchanged_in_order"

[[scenario]]
id = "submit-patch-removes-only-by-remove-list"
interface = "submit-file"
given = "a card patch with remove_interface, remove_anchors and remove_gaps naming entries the card has"
expect = "exactly the named entries are removed; entries a patch merely omits stay"
level = "integration"
command = "cargo test --test submit remove_interface_removes_exactly_the_named_ids"

[[scenario]]
id = "submit-rejects-bad-removal"
interface = "submit-file"
given = "a removal naming a key the card lacks, or a key the same patch also adds or updates"
expect = "answer_parse_failed on the remove field and no write"
level = "integration"
command = "cargo test --test submit removing_a_key_the_card_does_not_have_is_rejected"

[[scenario]]
id = "stdout-brief-matches-written-brief"
interface = "brief-build"
given = "brief --stdout for a maintainer"
expect = "prints byte for byte the brief a plain brief writes, and writes no file"
level = "integration"
command = "cargo test --test brief stdout_prints_the_brief_and_writes_nothing"

[[scenario]]
id = "submit-caps-fix-task-text"
interface = "submit-file"
given = "a changes review whose findings join into a fix task longer than 20,000 characters"
expect = "answer_too_long on findings and no write"
level = "integration"
command = "cargo test --test submit findings_whose_fix_task_passes_the_task_cap_are_answer_too_long"

[[scenario]]
id = "submit-long-fix-task-under-cap"
interface = "submit-file"
given = "a changes review whose joined findings pass 4500 characters but stay under the task cap"
expect = "the submit succeeds and the developer brief reads the fix task"
level = "integration"
command = "cargo test --test submit changes_with_long_findings_writes_a_fix_task_the_developer_brief_reads"

[[scenario]]
id = "tester-bug-anchor-from-interface"
interface = "card-patch"
given = "a tester bug naming an interface, and a repeat of a bug whose card gap has an anchor"
expect = "the gap anchor is the named interface's anchor; a bug naming no interface keeps the gap's existing anchor"
level = "integration"
command = "cargo test --test submit_roles tester_repeated_bug_sets_the_anchor_only_when_it_names_an_interface"

[[scenario]]
id = "brief-states-cap-rule"
interface = "brief-build"
given = "a maintainer brief built for a unit"
expect = "after the schema and answer path, the brief says a field over its stated cap is rejected and to stay under it"
level = "integration"
command = "cargo test --test brief sections_appear_in_frame_order"

[[scenario]]
id = "review-brief-carries-each-unit"
interface = "review-brief"
given = "two stamped units whose interfaces both changed"
expect = "one review.md brief showing each unit's hunks, card, scenarios, test command and doc"
level = "integration"
command = "cargo test --test review review_brief_carries_each_units_hunks_card_scenarios_test_command_and_doc"

[[scenario]]
id = "review-budget-next-round"
interface = "review-brief"
given = "due units past the review budget"
expect = "the units that fit are covered, the rest named as next round and still due"
level = "integration"
command = "cargo test --test review units_past_the_review_budget_are_next_round_and_stay_due"

[[scenario]]
id = "review-approve-stamps"
interface = "review-submit"
given = "a reviewer answer approving every unit"
expect = "each unit is stamped with tester and documenter marks set, and next lists nothing"
level = "integration"
command = "cargo test --test review approving_every_unit_stamps_it_and_sets_both_marks_so_neither_next_lists_anything"

[[scenario]]
id = "review-changes-fix-task"
interface = "review-submit"
given = "changes on one unit and approve on the other"
expect = "the approved unit is stamped; the other gets its fix task and no stamp"
level = "integration"
command = "cargo test --test review changes_on_one_unit_stamps_the_other_and_writes_its_fix_task"

[[scenario]]
id = "review-older-brief"
interface = "review-submit"
given = "an answer whose snapshot is not the brief's"
expect = "no_brief and nothing written"
level = "integration"
command = "cargo test --test review an_answer_to_an_older_review_brief_is_no_brief_and_writes_nothing"

[[scenario]]
id = "review-header-units"
interface = "submit-file"
given = "a review header listing an unstamped, unknown or repeated unit"
expect = "no_brief"
level = "integration"
command = "cargo test --test review a_header_listing_an_unstamped_unknown_or_repeated_unit_is_no_brief"

[[scenario]]
id = "submit-writes-result"
interface = "submit-file"
given = "a maintainer review or explain job, first answered with unparseable JSON, then with a valid answer"
expect = "the rejected submit writes no result file; the accepted one writes exactly what it printed to api-maintainer-<snap>.result.json"
level = "integration"
command = "cargo test --test submit an_accepted_submit_writes_what_it_printed_to_the_result_file"

[[scenario]]
id = "submit-roles-write-result"
interface = "submit-file"
given = "accepted tester, documenter, validator and architect submits"
expect = "each writes exactly what it printed beside its brief as <stem>.result.json"
level = "integration"
command = "cargo test --test submit_roles each_roles_accepted_submit_writes_what_it_printed_to_its_result_file"

[[scenario]]
id = "developer-brief-handoff"
interface = "brief-handoff"
given = "a developer brief run over two tasks"
expect = "each job carries its brief_path and the handoff Read `<brief_path>` and follow it."
level = "integration"
command = "cargo test --test developer two_tasks_with_disjoint_lanes_give_two_briefs_with_their_task_and_lane"

[[scenario]]
id = "handoff-refuses-backtick"
interface = "brief-handoff"
given = "a workspace repo directory whose name holds a backtick or instruction-like text"
expect = "a backtick is unsafe_path; other text stays inside the handoff's code span"
level = "integration"
command = "cargo test --test next a_workspace_repo_directory_name_cannot_steer_the_handoff"

[[scenario]]
id = "answer-too-long-target"
interface = "answer-too-long"
given = "a maintainer answer with a 302-character field capped at 300"
expect = "answer_too_long saying 302 characters, cap 300, cut to 240 or fewer; the fix says it does not count toward the three tries"
level = "integration"
command = "cargo test --test submit answer_too_long_says_how_far_over_and_a_target_well_under_the_cap"

[[scenario]]
id = "submit-brief-by-snapshot"
interface = "submit-file"
given = "two briefs for one job at different snapshots"
expect = "an answer named for neither is no_brief; one named for a brief whose header disagrees is no_brief; one named for the current brief succeeds and leaves the other"
level = "integration"
command = "cargo test --test submit with_two_briefs_for_the_job_only_an_answer_named_for_one_finds_it"

[[scenario]]
id = "brief-write-removes-superseded"
interface = "brief-write"
given = "an older snapshot's tester brief and answer beside its result, another job's brief and non-job names"
expect = "writing the tester brief removes only the older brief and answer"
level = "integration"
command = "cargo test --test brief writing_a_brief_removes_the_jobs_superseded_brief_and_answer_and_nothing_else"

[[scenario]]
id = "review-old-handoff-no-file"
interface = "brief-path"
given = "a review brief written again at a new snapshot"
expect = "the old brief is gone, so the old handoff names a file that does not exist"
level = "integration"
command = "cargo test --test review a_new_review_brief_removes_the_superseded_one_so_an_old_handoff_names_no_file"

[[scenario]]
id = "job-name-round-trip"
interface = "job-name"
given = "every name rel_path builds, its answer and result names, and near-miss names"
expect = "job_of reads each built name back and rejects every near miss"
level = "unit"
command = "cargo test --lib job_of_reads_back_every_name_rel_path_builds_and_nothing_else"

[[scenario]]
id = "unit-own-test-command"
interface = "command-allowlist"
given = "a tester repro using another unit's test command, then a scenario and repro using its own"
expect = "the other unit's is command_not_allowed; its own is accepted and the test card command is unchanged"
level = "integration"
command = "cargo test --test submit_roles a_units_own_test_command_is_allowed_for_its_jobs_and_no_other_units"
