[[interface]]
id = "next"
anchor = "src/next.rs::next"
contract = "Per unit, jobs due vs snapshot: maintainer if stale/unreviewed (with debt added); stamped units only: tester if an interface or owned test file changed since its mark, documenter if an interface file changed or no docs; validator for an unjudged bug; architect first when 2+ stamped units moved."

[[interface]]
id = "next_run"
anchor = "src/next.rs::run"
contract = "`stewards next`: `--pr` is not implemented; writes briefs unless --no-brief; exits 0 only when there are no jobs and no check failures, else 1."

[[interface]]
id = "status"
anchor = "src/status.rs::status"
contract = "Per unit of each initialized repo: freshness (fresh/stale/unreviewed by fingerprint), interfaces, interfaces covered by a scenario, non-bug gaps, bugs, and debt count; uninitialized repos listed apart; workspace names carry the repo prefix."

[[interface]]
id = "status_run"
anchor = "src/status.rs::run"
contract = "`stewards status`: always exits 0; with --telemetry adds the current repo's telemetry summary, or null with no current repo."

