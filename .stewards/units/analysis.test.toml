unit = "analysis"

[[scenario]]
id = "check-uncovered-one-finding-per-unit"
interface = "check-report"
given = "unit `store` has 2 interfaces and a scenario covers only one of them"
expect = "exactly one uncovered_interface warning, unit store, anchor null, message `store: 1 of 2 interfaces have no scenario: count-items`"
level = "integration"
command = "cargo test --test check interface_no_scenario_references_warns_uncovered"

[[scenario]]
id = "check-uncovered-lists-ten-ids-then-count"
interface = "check-report"
given = "unit `store` with 12 interfaces, 11 of them without a scenario"
expect = "one uncovered_interface warning for the unit listing the first 10 uncovered ids joined by commas, then ` (+1 more)`"
level = "integration"
command = "cargo test --test check uncovered_interfaces_are_one_finding_per_unit_listing_ten_ids"

[[scenario]]
id = "check-stamp-creates-missing-card"
interface = "check-stamp"
given = "unit store has no card file"
expect = "stamp store exits 0 and the reloaded store card has [reviewed]"
level = "integration"
command = "cargo test --test check stamping_a_unit_without_a_card_creates_one"

[[scenario]]
id = "check-stamp-keeps-card-and-role-marks"
interface = "check-stamp"
given = "a card with role marks, gaps, doc prose"
expect = "stamp keeps them exactly and rewrites only [reviewed]"
level = "integration"
command = "cargo test --test check stamping_keeps_role_marks_and_the_rest_of_the_card"

[[scenario]]
id = "anchor-resolve-overlapping-match"
interface = "anchor-resolve"
given = "a file where a rejected partial match overlaps a later whole-word match of the name"
expect = "resolve returns Found at the later whole-word match (the occurrences refactor still steps one char)"
level = "integration"
command = "cargo test --test anchors match_overlapping_a_rejected_match_is_found"

[[scenario]]
id = "anchor-resolve-whole-word-after-partial"
interface = "anchor-resolve"
given = "a file with the name first inside a longer identifier, then as a whole word"
expect = "resolve returns Found on the whole-word line, not DeadName"
level = "integration"
command = "cargo test --test anchors a_whole_word_after_a_partial_one_is_found"

[[scenario]]
id = "check-instructions-warns-without-agents-md"
interface = "check-instructions"
given = 'repo.toml lists instruction_files = ["OTHER.md"] and OTHER.md does not mention AGENTS.md'
expect = "one instructions_unlinked warning with path OTHER.md; check still exits 1 only for unstamped units"
level = "integration"
command = "cargo test --test check a_listed_instruction_file_without_agents_md_warns"

[[scenario]]
id = "check-instructions-quiet-when-linked"
interface = "check-instructions"
given = "listed OTHER.md contains @AGENTS.md"
expect = "no instructions_unlinked warning"
level = "integration"
command = "cargo test --test check a_listed_instruction_file_that_mentions_agents_md_does_not_warn"

[[scenario]]
id = "check-instructions-missing-warns"
interface = "check-instructions"
given = "listed nope/OTHER.md does not exist"
expect = "one instructions_unlinked warning with path nope/OTHER.md"
level = "integration"
command = "cargo test --test check a_missing_listed_instruction_file_warns"

[[scenario]]
id = "check-instructions-symlink-not-followed"
interface = "check-instructions"
given = "listed OTHER.md is a symlink to a file outside the repo that mentions AGENTS.md"
expect = "the link is not followed: one instructions_unlinked warning with path OTHER.md"
level = "integration"
command = "cargo test --test check a_symlinked_listed_instruction_file_is_not_followed"

[[scenario]]
id = "check-instructions-filter-drops"
interface = "check-instructions"
given = "listed OTHER.md does not mention AGENTS.md and check runs with unit filter store"
expect = "unfiltered check warns instructions_unlinked for OTHER.md; the filtered report has no instructions_unlinked warning"
level = "integration"
command = "cargo test --test check a_unit_filter_drops_instructions_unlinked"
