[[interface]]
id = "route-owner"
anchor = "src/route.rs::owner"
contract = "owner(path): unit with the most specific matching glob (longest literal prefix, then fewest wildcards; ties by units.toml order). Normalizes ./ and backslashes. .stewards/**, docs_path/** and .git paths (any ASCII case) have no owner. Bad glob: invalid_toml."

[[interface]]
id = "route-overlaps"
anchor = "src/route.rs::overlaps"
contract = "Router::overlaps(files) lists each file two or more units match at equal top specificity, with those units; a strictly more specific match is not an overlap."

[[interface]]
id = "route-command"
anchor = "src/route.rs::run"
contract = "`stewards route <paths>` maps each path to its owning unit (repo-prefixed in a workspace) or null. Outside every repo: path_outside_repo. Uninitialized sibling repo in a workspace owns nothing; a lone uninitialized repo errors."

[[interface]]
id = "anchor-resolve"
anchor = "src/anchors.rs::resolve"
contract = "resolve: first case-sensitive whole-word match of name -> Found{line} (1-based); no match or empty name -> DeadName; absolute, ./.. components, symlinked or unreadable path -> DeadPath. Invalid UTF-8 never panics."

[[interface]]
id = "anchor-source-window"
anchor = "src/anchors.rs::source_window"
contract = "source_window(root, anchor, before, after) returns the matched line plus `before` lines above and `after` below, clamped to the file; None for a dead anchor."

[[interface]]
id = "check-fingerprint"
anchor = "src/check.rs::fingerprint"
contract = "fingerprint(tree, unit, router) is `sha256:<hex>` over the sorted `path blob` lines of the files the unit owns (not merely matches) in the snapshot; is_stale is true with no [reviewed] or a differing fingerprint."

[[interface]]
id = "check-stamp"
anchor = "src/check.rs::stamp"
contract = "stamp writes [reviewed] {commit, fingerprint, tree, tester, documenter} to the unit's card, creating it if missing and keeping the rest; unmarked roles take the old stamp's tree; no commits -> empty commit; unknown unit errors."

[[interface]]
id = "check-report"
anchor = "src/check.rs::check_at"
contract = "check fails on unreviewed, stale, dead_anchor (outside snapshot or unresolved), unknown_interface; warns overlap, one uncovered_interface per unit, one unowned (not in repo.toml unowned_ok); each lists 10 sorted + count. A unit filter drops overlap/unowned/instructions_unlinked. Exit 1 on failures."

[[interface]]
id = "debt-scan"
anchor = "src/debt.rs::scan"
contract = "scan(repo) returns `simplified:` debt lines (case-insensitive, a comment marker # // -- ; /* * <!-- earlier on the line) of tracked regular, non-binary files outside .stewards/, keyed by owning unit (None = unowned); tracked-but-deleted files are skipped. `stewards debt` prints them per unit."

[[interface]]
id = "anchor-interface-lines"
anchor = "src/anchors.rs::interface_lines"
contract = "interface_lines(text, name): sorted 1-based lines of the blocks around each whole-word name (a::b / a.b also matches b): down to a dedented line after a blank with brackets closed; up the contiguous run plus one detached doc/attribute run. Empty when absent."

[[interface]]
id = "check-instructions"
anchor = "src/check.rs::check_at"
contract = "check warns instructions_unlinked (unit null, path = the file) for each repo.toml instruction_files entry Repo::read cannot read (missing, symlinked, over 1 MiB) or whose text lacks AGENTS.md. Never a failure; a unit filter drops it."

