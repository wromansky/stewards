[doc]
overview = "The jobs unit is the hand-off between the tool and the agent that does a piece of work. The tool writes a brief for one role on one unit (or for the architect, who has no unit), the agent answers in typed JSON, and submitting that answer checks it against the brief, writes the resulting updates, and retires the brief. Where the answer carries a card patch, submit also applies it to the unit's card: each list updates entries by key, and only the explicit remove lists delete. Each submit also leaves one line of telemetry, so you can see how large the packs were and how many anchors agents had to open. It lives in src/brief.rs, src/submit.rs and src/telemetry.rs."
how_it_works = "Building a brief packs and frames a role's context (build in src/brief.rs); it refuses a repo root with control or line-separator characters (unsafe_path), and a validator brief with no unjudged bug is a usage error. The brief goes to .stewards/briefs/<unit>-<role>.md (architect.md; <unit>-developer-<n>.md, n from 1). Its first line is a stewards-job comment holding a JSON header that read_header parses; a missing file or bad header is no_brief. Writing a brief deletes the stale .answer.json beside it. Submit (submit_file in src/submit.rs) requires a known unit (none for the architect), a header matching unit, role, task number and full tree id, and a regular answer file of at most 256 KiB, then runs the role's handler. For a card patch, check_patch validates before any write. Three upsert lists (interface by id, anchors by path and name, gaps by title) and three remove lists (remove_interface, remove_anchors, remove_gaps). A removal must name a key the card has, so a typo is answer_parse_failed, and must not also be upserted in the same patch. The handler starts from the old card and applies each upsert through put, replacing the entry with the same key or appending, so whatever the patch omits stays; a replaced gap keeps its severity and issue. The remove lists apply last. The result is reported as a card line of added, edited and removed entries, and the card is written only when a patch is present or the review approved. Writes go through write_remove_and_retire, which refuses link paths and returns card_changed before any write if a checked file changed since it was recorded; it writes in order, then removes the brief, and a later failure names the files already written. Finally src/telemetry.rs appends one JSON line of sizes and counts to .stewards/telemetry/<yyyy-mm>.jsonl, a failure only a warning. The summary function gives per-role counts, mean pack bytes and total pulled anchors, null with no files, skipping unreadable ones."
how_to_change = "Start in src/brief.rs for what a brief says or where it lives, and in src/submit.rs for what an answer must satisfy or what a submit writes. Keep the header line format and the brief path scheme in step with each other, because submit finds the brief by path and trusts the header to match unit, role, task and tree id. Keep write_remove_and_retire checking for changed files and link paths before it writes anything, and keep the brief removal last, so a failed submit leaves the brief to retry. For card patches, keep an omitted entry meaning keep: a list updates by key through put, and an entry leaves the card only by being named in a remove list that check_patch has checked against the card. A key that a patch both upserts and removes is rejected rather than ordered. If you add a new patch list, give it a key, a check in check_patch, and a line in the card change report. Keep telemetry to sizes and counts, never content, and never let it fail a submit. The tests are tests/brief.rs, tests/submit.rs, tests/submit_roles.rs and tests/developer.rs. Add the case to the one matching the file you changed, and for a change to what a brief names or contains, assert on the rendered brief text in tests/brief.rs."
