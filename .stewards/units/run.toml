[[gap]]
kind = "gap"
title = "Reader threads outlive a held-open pipe"
anchor = "src/run.rs::run"
note = "A process that left the group and holds stdout/stderr open leaves the two reader threads running after run returns (the wait for them is 1s each); output after that is lost."

[[gap]]
kind = "gap"
title = "Streams share one buffer without order guarantee"
anchor = "src/run.rs::run"
note = "stdout and stderr chunks are appended in read order, so interleaving of the two streams is approximate; a signalled child has exit_code None."

[[gap]]
kind = "future"
title = "run::run has no caller yet"
anchor = "src/run.rs::run"
note = "Only run::allowed and run::check are used (by submit); later tasks add the callers of run::run."

[doc]
overview = "run is the one place a command may start. allowed builds the allowlist: the repo's commands.test entries (each with its own timeout, else commands.timeout_seconds) plus the named unit's test_command, never another unit's and never commands.lint. check is the gate every agent-written command passes (submit applies it to scenarios, repros, tasks and flow checks): no SHELL_CHARS, and the leading words must be all the words of an allowed entry. run refuses what check refuses, and otherwise executes it."
how_it_works = "run splits the command on whitespace and spawns it without a shell from the repo root, stdin null, env inherited, in its own process group. Two threads drain stdout and stderr into one capped buffer so a full pipe cannot block the child. The parent polls try_wait every 50ms; at the entry's timeout it SIGKILLs the whole group, so background children die too. Output keeps the last 4000 characters, control characters turned to spaces and invisible characters escaped. A timeout (with a command_timeout line appended) or a program that cannot start is a failed RunResult; only a refused command is an error, command_not_allowed. Readers are waited for 1s each after exit, so a process that left the group and holds a pipe open cannot hang run."
how_to_change = "Keep check the single gate: a new caller of run goes through run::run or run::check, never Command directly with an agent-written string. Widening SHELL_CHARS or the prefix rule changes what submit accepts, so update submit's command_not_allowed example and its tests too. A change to timeout or kill behaviour is checked by a_timeout_kills_the_whole_process_group_and_is_a_result in tests/run.rs. commands.lint stays out of allowed."
