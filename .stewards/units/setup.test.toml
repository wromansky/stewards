unit = "setup"

[[scenario]]
id = "docs-escapes-markup-only"
interface = "docs"
given = 'an interface contract containing | \ ` < > [ ] ! * _ ~ & # : @ and www. (any case)'
expect = "each markup-starting character is backslash-escaped, the table row keeps its 4 separators, and ordinary prose (commas, periods, hyphens, parentheses, slashes, semicolons) has no backslash"
level = "integration"
command = "cargo test --test docs"

[[scenario]]
id = "init-gitignore-slash-variants"
interface = "init"
given = "a .gitignore that already holds /.stewards/telemetry/ and /.stewards/briefs (leading slash, no trailing slash)"
expect = "init treats both as present: .gitignore is unchanged and not listed in wrote"
level = "integration"
command = "cargo test --test init gitignore_lines_written_with_a_leading_or_without_a_trailing_slash_are_present"

[[scenario]]
id = "init-repo-name-from-origin"
interface = "init"
given = "a git repo with an origin remote https://example.invalid/acme/widgets.git"
expect = "repo.toml name is widgets (origin URL last segment without .git); without an origin it falls back to the directory name"
level = "integration"
command = "cargo test --test init the_repo_name_is_the_origin_url_last_segment_when_there_is_an_origin"

[[scenario]]
id = "init-draft-ends-with-next-roles"
interface = "init-draft"
given = "a fresh git repo with two source dirs, run `init --draft`"
expect = "jobs are the architect job and a maintainer first review per unit, each with handoff ``Read `<brief path>` and follow it.``, and `then` ends with `run stewards review --roles until it exits 0`"
level = "integration"
command = "cargo test --test init_draft draft_on_a_fresh_repo_writes_step_1_and_the_architect_and_first_review_briefs"

[[scenario]]
id = "guide-unknown-harness-is-generic"
interface = "guide"
given = "`guide --harness emacs` (a name not in the harness table)"
expect = "exit 0, harness null, and the same delegation text as with no harness detected"
level = "integration"
command = "cargo test --test guide a_harness_not_in_the_table_gets_the_generic_guidance"

[[scenario]]
id = "guide-delegation-identical-for-every-harness"
interface = "guide"
given = "`guide`, `guide --all`, and `guide --harness nosuchharness`"
expect = "every all_delegations text and the unknown harness's delegation equal the no-harness delegation word for word"
level = "integration"
command = "cargo test --test guide every_harness_gets_the_same_delegation"

[[scenario]]
id = "init-ends-with-agents-only-note"
interface = "init"
given = "a fresh repo with main.py, run `init` and `--human init`"
expect = "JSON note equals guide::AGENTS_ONLY (which names instruction_files) and the human output contains it"
level = "integration"
command = "cargo test --test init init_says_the_block_is_in_agents_md_only_in_json_and_human_output"

[[scenario]]
id = "init-unit-test-commands"
interface = "init"
given = "a repo with svc/Cargo.toml, py/pyproject.toml, web/package.json with a test script, blank/package.json with npm's placeholder, tool/Makefile with a test target, no root manifest"
expect = "each unit's test card holds its own command run from the root (cargo test --manifest-path svc/Cargo.toml, pytest py, npm test --prefix web, make -C tool test), blank has none, repo commands.test is empty"
level = "integration"
command = "cargo test --test init each_unit_gets_its_own_test_command_and_the_repo_only_its_roots"

[[scenario]]
id = "init-root-test-layout"
interface = "init"
given = "a repo with items.py and test_items.py at the root and no manifest"
expect = "repo commands.test is [python3 -m unittest] and the unit has no test_command of its own"
level = "integration"
command = "cargo test --test init a_root_test_layout_sets_the_repo_wide_command"

[[scenario]]
id = "init-unit-test-disagreeing-dirs"
interface = "init"
given = "unit_test over paths a/** (Cargo.toml) and b/** (test_x.py), with and without cargo among the repo root's toolchains"
expect = "disagreeing dirs give no command and a note naming the cargo command; with root cargo the Python dir's unittest command is the unit's; a non-dir/** path is ignored"
level = "unit"
command = "cargo test --lib unit_test_takes_none_when_its_directories_disagree_or_the_repo_covers_it"

[[scenario]]
id = "init-unit-test-disagreeing-note"
interface = "init"
given = "a repo whose unit a spans src/a (test_x.py) and src/b (Makefile with a test target), run `--human init` and `init`"
expect = "unit a has no test_command; its test_note names both python3 -m unittest discover -s src/a and make -C src/b test, and the human output contains that note"
level = "integration"
command = "cargo test --test init a_unit_whose_directories_disagree_gets_no_command_and_a_note"

[[scenario]]
id = "init-draft-first-review-records-gaps"
interface = "init-draft"
given = "a fresh repo after init --draft and the architect submit; a first maintainer review answers changes with a finding, then approves with the problem as a card_patch gap"
expect = "the finding is refused (answer_parse_failed on verdict and findings[0]), the gap answer stamps, review --roles exits 0 with src unchanged"
level = "integration"
command = "cargo test --test init_draft adoption_records_problems_as_gaps_and_review_roles_exits_0_with_no_source_change"

[[scenario]]
id = "guide-roles-say-what-a-stamp-claims"
interface = "guide"
given = "`guide` with no flags"
expect = "roles say a stamp is one reviewer reporting no finding, not proof the code is right, and that review --roles is the deeper pass"
level = "integration"
command = "cargo test --test guide roles_say_a_stamp_is_one_reviewer_reporting_no_finding"
