[[interface]]
id = "ls_files"
anchor = "src/git.rs::ls_files"
contract = "Tracked paths from the index (ls-files -z), raw UTF-8; errors when git fails."

[[interface]]
id = "snapshot"
anchor = "src/git.rs::snapshot"
contract = "Tree sha of the working tree (tracked, modified, untracked-not-ignored) built in a private temp index copy that keeps the real index's mtime; real index, HEAD and refs untouched; refuses a pre-existing temp path; works with no commits and in linked worktrees."

[[interface]]
id = "ls_tree"
anchor = "src/git.rs::ls_tree"
contract = "(path, blob sha) for every file in a tree, recursive; a leading-dash rev is an error."

[[interface]]
id = "has_object"
anchor = "src/git.rs::has_object"
contract = "True only when the name resolves to a tree (or a commit's tree); blob, unknown, or leading-dash name is false."

[[interface]]
id = "is_tree"
anchor = "src/git.rs::is_tree"
contract = "True only when the name is a tree object itself; commit, blob, or unknown is false."

[[interface]]
id = "diff_names"
anchor = "src/git.rs::diff_names"
contract = "Paths changed between two revs, no rename detection; leading-dash revs are errors."

[[interface]]
id = "diff_file"
anchor = "src/git.rs::diff_file"
contract = "Unified diff (-U3, no color, no ext diff, a/ b/ prefixes) of one path between two revs; the path is matched literally, never as a glob."

[[interface]]
id = "diff_added_lines"
anchor = "src/git.rs::diff_added_lines"
contract = "Added lines as (path, new-file line number, text); paths with spaces handled; C-quoted paths skipped."

[[interface]]
id = "head_commit"
anchor = "src/git.rs::head_commit"
contract = "HEAD commit sha; None before the first commit; error for any other git failure."

[[interface]]
id = "task_text"
anchor = "src/git.rs::task_text"
contract = "Current branch (HEAD when detached), then the last commit subject on the next line, omitted before the first commit; error outside a repo."

[[interface]]
id = "recent_commit_files"
anchor = "src/git.rs::recent_commit_files"
contract = "Files touched by each of the last n commits, newest first, merges list none; empty with no commits."

[[interface]]
id = "origin_url"
anchor = "src/git.rs::origin_url"
contract = "URL of the origin remote, trimmed; None when there is no origin, it is empty, or git fails."

