[[interface]]
id = "release-workflow"
anchor = ".github/workflows/release.yml::release"
contract = "On a v<x>.<y>.<z> tag: check tag, Cargo.toml version, baml pin and library sha256s; build four archives; create the release with SHA256SUMS and install.sh; cargo publish; bump and push the AUR package (not for prereleases)."

[[interface]]
id = "install-sh"
anchor = "install.sh::sha256"
contract = "sh install.sh [v<version>] installs a release under ${STEWARDS_PREFIX:-$HOME/.local}; refuses non-plain versions before any network call, refuses musl, and installs nothing unless the tarball matches its SHA256SUMS entry."

[[interface]]
id = "aur-bump"
anchor = "packaging/aur/bump.sh::bump"
contract = "sh bump.sh <version> <64-hex sha256 of the .crate> rewrites pkgver, pkgrel=1 and the first sha256sums entry in PKGBUILD and the same lines in .SRCINFO; rejects a malformed version or hash."

[[interface]]
id = "aur-pkgbuild"
anchor = "packaging/aur/PKGBUILD::package"
contract = "Builds the crates.io crate and installs binary, libbaml_cffi in /usr/lib/stewards, completions for bash, zsh and fish, the man page and LICENSE."

[[interface]]
id = "release-checklist"
anchor = "RELEASING.md::Releasing"
contract = "Ordered maintainer steps from version bump to post-release verification, plus known limits."

[[interface]]
id = "completions-tests"
anchor = "tests/completions.rs::FakeRelease"
contract = "Tests stewards completions (five shells, save hint on stderr), stewards man, install.sh against a fake release served by curl and uname shims with no network, and bump.sh on a temp copy of PKGBUILD and .SRCINFO over two successive bumps."

