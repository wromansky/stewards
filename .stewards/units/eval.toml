[[gap]]
kind = "gap"
title = "Ritual steps are best-effort from transcripts"
anchor = "src/eval/mod.rs::stewards_commands"
note = "A stewards command is seen only as the program of a separator-split segment: timeout/env/time prefixes, `if stewards`, `{ ...; }`, `bash -c`, and backticks are misread or missed (stated in RITUAL_NOTE)."

[[gap]]
kind = "gap"
title = "shell_reads misreads a later cd or a for list"
anchor = "src/eval/mod.rs::shell_reads"
note = "simplified: only a leading cd is followed; upgrade if files_opened disagrees with the transcripts."

[[gap]]
kind = "gap"
title = "reviewed_units ignores --human output"
anchor = "src/eval/mod.rs::reviewed_units"
note = "simplified: only JSON submit output is read; upgrade if reviewers start passing --human."

[[gap]]
kind = "gap"
title = "Leftover processes are killed only on Linux"
anchor = "src/eval/mod.rs::kill_leftovers"
note = "Superseded: macOS now lists leftovers through lsof and ps -E. Remaining ceiling on macOS: ps prints the environment space separated, so a HERMES_HOME holding a space is cut short, and a system binary (SIP) shows no environment; upgrade path is sysctl KERN_PROCARGS2 through libc."

[[gap]]
kind = "gap"
title = "Claude Code runs have no trusted cost"
anchor = "src/eval/claude.rs::parse"
note = "Claude Code 1.0.128 prices unknown model ids at another model's rates, so cost_usd is null, spent_usd is null for a claude-code eval, and --max-cost is refused for it."

[[gap]]
kind = "future"
title = "Only the Pi, Claude Code and Hermes harnesses are driven"
anchor = "src/eval/mod.rs::run"
note = "Any other --harness is not_implemented; a new one needs a Driver and a branch in run."

[[gap]]
kind = "gap"
title = "Hermes runs have no trusted cost"
anchor = "src/eval/hermes.rs::parse"
note = "Hermes prices DeepSeek at off-peak rates in every hour, so cost_usd is null, its figure is harness_reported_cost_usd, and --max-cost is refused for hermes."

[[gap]]
kind = "gap"
title = "Hermes execute_code shell commands are unseen"
anchor = "src/eval/hermes.rs::parse"
note = "Commands an execute_code script runs through terminal() are not in shell_commands, files opened, or ritual steps."

[[gap]]
kind = "gap"
title = "Hermes files_opened does not follow a cd across terminal calls"
anchor = "src/eval/hermes.rs::files_opened"
note = "simplified: only a call's workdir and a leading cd are followed; upgrade if files_opened disagrees with the transcripts."

[[gap]]
kind = "gap"
title = "Claude Code on macOS loads the user's CLAUDE.md in every arm"
anchor = "src/eval/claude.rs::isolate"
note = "Without a user .credentials.json the session runs in the user's own config dir; --setting-sources project,local drops user settings, hooks, plugins and --strict-mcp-config drops MCP servers, but user CLAUDE.md, rules, skills, agents and commands still load in bare and block-only arms. Stated in the summary note and DESIGN.md. Upgrade path: link the Keychain login into an isolated dir."

[doc]
overview = "The eval unit is the runner behind `stewards eval`. It measures whether coding agents do better with stewards than without: it drives a harness (Pi, Claude Code or Hermes Agent) over a suite of tasks in several arms, parses every session transcript into a run record, checks that the full arm followed the ritual, and reports cost and token overhead. The graders never branch on the harness. It also holds the material it runs on under evals/: the fixture, task prompts, suite manifests, arms.sh, and one reproduction per seeded bug."
how_it_works = "run (mod.rs) accepts pi, claude-code and hermes, picks arms, loads the suite (suite.rs, which checks each task's repro exists) and checks task numbers. pi.rs writes an isolated Pi agent dir; claude.rs a CLAUDE_CONFIG_DIR; hermes.rs a template home from which each session gets a fresh HERMES_HOME and whose gateway daemon is killed after it. Only pi takes --max-cost. execute reads every task prompt first, prepares the full arm once, then runs each task per run in every arm in a fresh copy. Each Driver starts a session (run_session, killing its group on timeout or on the one SIGINT/SIGTERM handler) and parses its transcript into a Run: tokens (null when unmeasurable, timed out or interrupted), cost, files opened (a listing never), stewards commands, subagent launches (a refused Hermes delegate is none), reviewer submits, a stored architect plan, models and thinking. After each session the runner runs `stewards next --no-brief --no-run` (full arms), runs the task's repro.sh with FIXTURE_ROOT set to the run directory (bug_fixed, every arm), records plan stored/closed on a task that expects_plan (full arm), and kills leftovers by cwd or HERMES_HOME. redact_secrets then replaces secret values (8+ chars) of each driver's credential_files with [redacted] in every kept session file and the run record. grade.rs grades each task on gate misses only; overhead ratios, bug_fixed and plan are report-only."
how_to_change = "Start in src/eval/mod.rs for the command, the plan, shared session helpers, the interrupt handler and the per-session loop; pi.rs, claude.rs or hermes.rs for a harness and its transcripts; grade.rs for verdicts and the report; suite.rs for manifest fields. Tests live in tests/eval.rs (the interrupt test in tests/eval_interrupt.rs, its own binary), with recorded transcripts under tests/fixtures/transcripts/<driver>/. Keep true: never write the user's harness config; bare and block-only arms never see stewards on PATH; overhead ratios, bug_fixed and plan stay report-only; graders never branch on the harness; one files-opened rule on every driver; no task prompt contains `think`; the first session always runs under --max-cost; no fixture holds key material; repro scripts take the fixture root from FIXTURE_ROOT. A new harness needs a Driver, a branch in run, and its entry in src/harness.rs."
