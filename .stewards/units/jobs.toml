[[gap]]
kind = "future"
title = "unchanged check and writes are not atomic"
anchor = "src/submit.rs::write_remove_and_retire"
note = "A concurrent submit writing between check_unchanged and the writes is still lost; marked simplified: in code, a lock file would close it."

[doc]
overview = "The jobs unit is the hand-off between the tool and the agent that does a piece of work. The tool writes a brief for one role on one unit (or for the architect, who has no unit), or the numbered reviewer briefs that together cover every due unit, and gives the agent one sentence to pass to a subagent: Read `<brief path>` and follow it. The architect's brief is the exception: its plan may come from the session that will make the change, so that brief omits the for-a-subagent line and its then line allows following it; every other brief, and every review, goes to a subagent. The agent answers in typed JSON, and submitting that answer checks it against the brief, writes the resulting updates, retires the brief, and leaves what it printed beside it as a result file for `stewards review` to collect. A review finding is blocking or a note: only blocking findings hold up approval or make a fix task, notes are printed and recorded. An agent that will not apply a finding answers it once; the next reviewer accepts or contests it. The brief carries the answer schema and each field's length cap, and a field over its cap is rejected. A card patch in an answer updates entries by key, and only the explicit remove lists delete. Each submit leaves one line of telemetry. It lives in src/brief.rs, src/submit.rs and src/telemetry.rs."
how_it_works = "Building a brief packs and frames a role's context (build in src/brief.rs). build_review returns one brief per group of pack::review, so every due unit is in exactly one and none waits for a later round; each header lists its units and its number n, and the text asks the answer to copy its snapshot. build refuses an unsafe repo root (unsafe_path) and a validator brief with no unjudged bug (usage). rel_path names a brief .stewards/briefs/<unit>-<role>-<snap>.md (architect-<snap>.md, review-<n>-<snap>.md, <unit>-developer-<n>-<snap>.md), <snap> the snapshot's first 8 hex characters; job_of reads a name back, write_text removes the job's briefs and answers at other snapshots, and write_round also the review briefs past the last. handoff turns a path into the one sentence; render adds the FOR_SUBAGENT line to every brief but the architect's, and Written carries THEN or THEN_ARCHITECT by role. read_header parses the header line (no_brief if missing or bad). submit_file takes the brief the answer file's name gives, else the job's one brief (find), checks the header, then runs the role's handler. A command in an answer must start with a commands.test entry or that unit's own test command (run::allowed builds the list and run::check judges it; check_command reports the refusal). check_patch validates a card patch before any write; apply_patch upserts, then removes. reviewer checks each header unit as the maintainer, tester and documenter are, and writes nothing on any error. It keeps the unit's blocking findings in <unit>-findings.json (StoredFinding); answer_finding records an answer, the reviewer accepts it or lists it in contested, and a stamp deletes the file. Writes go through write_remove_and_retire, which refuses link paths, returns card_changed if a checked file changed, and removes the brief last. Telemetry and the result file only warn."
how_to_change = "Start in src/brief.rs for what a brief says or where it lives, and in src/submit.rs for what an answer must satisfy or what a submit writes. Keep the header line format and the brief path scheme in step, because submit finds the brief by path and trusts the header to match. Build a job path only through rel_path, and its answer and result paths through answer_rel and result_rel. Give a subagent a brief only through handoff, and keep check_root refusing every character that could end or hide its code span. Print brief text only through emit. Keep the caps the schema states in step with the caps check_text enforces. Keep write_remove_and_retire checking for changed files and link paths before it writes, and the brief removal last. A check a role's handler makes belongs in a shared function the reviewer calls too; review re-checks a result's findings with ShownFinding::passes_submit_checks, so keep it in step with what submit checks. Briefs of one review round must stay independent: each submit stands alone. The findings file sits where subagents can write, so read it only through read_findings. An entry leaves a card only by a remove list that check_patch has checked. Keep telemetry to sizes and counts. Tests: tests/brief.rs, submit.rs, submit_roles.rs, developer.rs and review.rs; assert on the rendered brief text for a brief change."
