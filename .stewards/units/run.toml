[[interface]]
id = "run-allowed"
anchor = "src/run.rs::allowed"
contract = "The repo's commands.test entries (own timeout, else commands.timeout_seconds) plus the named unit's test_command only; never another unit's, never commands.lint."

[[interface]]
id = "run-check"
anchor = "src/run.rs::check"
contract = "Err if cmd has a SHELL_CHARS character or does not start with all the words of an allowed entry; else the matching entry with the most words."

[[interface]]
id = "run-run"
anchor = "src/run.rs::run"
contract = "Refused command: command_not_allowed error. Else runs argv, no shell, from root, in its own process group, SIGKILLed at the entry's timeout; returns pass, timed_out, exit_code, last 4000 chars of output. Timeout or unstartable program is a failed result."

[[interface]]
id = "run-shell-chars"
anchor = "src/run.rs::SHELL_CHARS"
contract = "Characters a command may not contain; submit's command_not_allowed example uses it."

