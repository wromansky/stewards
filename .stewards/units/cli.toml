[[interface]]
id = "json-envelope"
anchor = "src/output.rs::emit"
contract = "Every command prints one JSON object on stdout: `stewards: {version, schema: 1}` flattened with the payload; --human prints `Human::render` instead. A closed pipe is dropped silently, other write errors go to stderr; returns whether all was written."

[[interface]]
id = "cli-error"
anchor = "src/output.rs::CliError"
contract = "A failed command prints the envelope with `error: {code, message, fix}` (+ `errors` when non-empty) on stdout and exits 2; --human prints `error:` and `fix:` lines plus one line per field error. A non-CliError prints as code `internal`."

[[interface]]
id = "usage-errors"
anchor = "src/main.rs::main"
contract = "Clap parse failures (missing or unknown args) and a `-C` dir that cannot be entered are CliError code `usage`, exit 2, JSON unless --human appears in argv; --help and --version print clap's text and exit normally."

[[interface]]
id = "global-flags"
anchor = "src/main.rs::Cli"
contract = "--human, --repo <name>, -C <dir> and --direct are accepted before or after any subcommand; -C changes the working directory before dispatch; --direct is also set by STEWARDS_DIRECT=1."

[[interface]]
id = "not-implemented"
anchor = "src/output.rs::not_implemented"
contract = "Unbuilt commands (completions, render, validate) and flags (review --pr, next --pr) parse and then fail with CliError code `not_implemented`, exit 2."

[[interface]]
id = "review-command"
anchor = "src/review.rs::run"
contract = "`review [--task] [--roles]` shows up to 20 untracked result files per call as reported (not verified), removing them once output is written; lists next's jobs with handoffs unless findings or files remain; --task kept until done; exit 0 only when done, else 1."

