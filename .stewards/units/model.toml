[[interface]]
id = "load-repo"
anchor = "src/model.rs::load_repo"
contract = "Reads .stewards/ under git root into Loaded. Errors: not_a_git_repo, no_stewards_dir, schema_too_new (checked before the full parse), invalid_toml with file:line (also duplicate unit name), unsafe_path for a symlinked file or dir. A missing units.toml, card, or test card is fine."

[[interface]]
id = "unit-name"
anchor = "src/model.rs::unit_name"
contract = "A unit name in units.toml must match [a-z0-9][a-z0-9_-]*, else deserialization fails."

[[interface]]
id = "anchor-parse"
anchor = "src/model.rs::parse"
contract = "Anchor::parse splits `path::name` at the first `::`; both sides non-empty, else an error."

[[interface]]
id = "loaded-unit"
anchor = "src/model.rs::unit"
contract = "Loaded::unit(name) returns the unit or unknown_unit listing every unit name."

[[interface]]
id = "role-from-str"
anchor = "src/model.rs::from_str"
contract = "Parses the seven lowercase role names (developer, maintainer, tester, documenter, validator, architect, reviewer); anything else is unknown_role."

[[interface]]
id = "discover"
anchor = "src/workspace.rs::discover"
contract = "A stewards.toml at or above cwd wins over the nearer .git and lists repos (workspace_repo_missing for a non-dir entry); else the enclosing git root, or not_a_git_repo. A repo without .stewards/repo.toml loads as None. `only` keeps one repo by name, else unknown_repo listing names."

[[interface]]
id = "repo-containing"
anchor = "src/workspace.rs::repo_containing"
contract = "The repo with the deepest root containing canonical `path`, so a nested repo owns its files; None when none contains it."

[[interface]]
id = "current-repo"
anchor = "src/workspace.rs::current_repo"
contract = "The repo containing cwd, else the lone repo, else not_in_repo."

[[interface]]
id = "loaded-repos"
anchor = "src/workspace.rs::loaded_repos"
contract = "Each repo with its Loaded; uninitialized siblings in an unselected workspace are skipped, otherwise an uninitialized repo is no_stewards_dir."

[[interface]]
id = "display-name"
anchor = "src/workspace.rs::display_name"
contract = "`<repo>/<unit>` in a workspace, `<unit>` otherwise."

[[interface]]
id = "safe-path"
anchor = "src/workspace.rs::safe_path"
contract = "root/rel only when every `/`-separated part is a plain name and no existing component below root is a symlink, else unsafe_path. With create_dirs, missing parents are made one at a time and checked. The single path check for repo reads and writes."

[[interface]]
id = "repo-write"
anchor = "src/workspace.rs::write"
contract = "Replaces rel via a unique temp file renamed over it (a planted link is replaced, never followed), keeping the old file's permissions; the temp file is removed on failure."

[[interface]]
id = "repo-append"
anchor = "src/workspace.rs::append"
contract = "Appends to the regular file rel, creating it when missing; refuses a non-regular file or a symlinked path."

[[interface]]
id = "repo-remove"
anchor = "src/workspace.rs::remove"
contract = "Removes the regular file rel; missing is Ok; a non-regular file or symlinked path is refused."

[[interface]]
id = "user-config"
anchor = "src/user.rs::load_config_from"
contract = "Reads config.toml from the user dir ($STEWARDS_HOME, else ~/.stewards); missing file is an empty Config; Config::model(harness, role) is the pinned alias or None. Never writes."

[[interface]]
id = "user-memory"
anchor = "src/user.rs::load_memory_from"
contract = "Reads memory.toml [[entry]] items from the user dir; missing file is empty; malformed is invalid_toml with file:line. Never writes."

[[interface]]
id = "memory-for"
anchor = "src/user.rs::memory_for"
contract = "Entries whose roles (absent = all) include role and whose languages (absent = all) share one with `languages`, in file order, stopping before the first entry that pushes total text bytes past budget_bytes."

[[interface]]
id = "loaded-card"
anchor = "src/model.rs::card"
contract = "Loaded::card(unit) returns a clone of the unit's card, or an empty card (unit set, reviewed None, no interface, anchors, gaps, or doc) when it has none yet. The one lookup submit and check use instead of their own copies."

[[interface]]
id = "repo-read"
anchor = "src/workspace.rs::read"
contract = "Repo::read(rel, cap) returns the bytes of the regular file rel through safe_path, opened with no link followed and without blocking on a FIFO (unix), its type checked on the open handle; a non-regular file or one over cap bytes is an error."

