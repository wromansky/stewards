[[interface]]
id = "init"
anchor = "src/init.rs::propose"
contract = "Plain `init` refuses (already_initialized) if units.toml or repo.toml exists; else proposes units, writes both files (root-only repo test commands), a test card per unit whose own dirs give one command (else says why), appends missing .gitignore lines, upserts the AGENTS.md block, reports."

[[interface]]
id = "init-draft"
anchor = "src/init.rs::draft_jobs"
contract = "`init --draft` runs step 1 only on an uninitialized repo, briefs the architect naming job and a first review per never-reviewed unit, each with its handoff, then says to run `review --roles`; with --direct it checks every model guard, then submits each job; a failure reports how many were submitted."

[[interface]]
id = "init-hooks-ci"
anchor = "src/init.rs::not_implemented"
contract = "`init --hooks` and `init --ci` return not_implemented."

[[interface]]
id = "agents-block"
anchor = "src/guide.rs::upsert_block"
contract = "Writes the stewards block at the top of AGENTS.md (creating the file), or replaces the text between existing start/end markers; returns whether the file changed, so a rerun is a no-op."

[[interface]]
id = "guide"
anchor = "src/guide.rs::run"
contract = "`guide` prints the block's ritual, handoff, editing and hygiene paragraphs, roles, adoption, the AGENTS.md-only note, and one delegation text identical for every harness, named, detected, unknown or none; --all, --errors, --glossary add every harness, the error table, the glossary."

[[interface]]
id = "harness-detect"
anchor = "src/harness.rs::detect"
contract = "Returns the first harness whose env var prefix matches the current environment; harnesses with an unverified env rule are never detected."

[[interface]]
id = "harness-by-name"
anchor = "src/harness.rs::by_name"
contract = "Looks up a harness case-insensitively; an unknown name is harness_unknown listing the valid names."

[[interface]]
id = "docs"
anchor = "src/docs.rs::pages"
contract = "`docs [unit]` renders docs_path/<unit>.md for one or every unit plus README.md from cards, tests and repo.toml, escaping card text and linking live anchors; rejects a docs_path that is empty or escapes the repo and an unknown unit; writes only changed files."

