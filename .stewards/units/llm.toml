[[interface]]
id = "role-text"
anchor = "src/llm.rs::role_text"
contract = "Returns the role's prompt text rendered from baml_src (src/llm_schema/<role>.role.txt), with `<unit>` left for the caller to fill; only the maintainer distinguishes Review/Explain modes."

[[interface]]
id = "output-format"
anchor = "src/llm.rs::output_format"
contract = "Returns BAML's ctx.output_format text for the role's answer shape (src/llm_schema/<role>.schema.txt); non-maintainer roles ignore the mode."

[[interface]]
id = "parse-answer"
anchor = "src/llm.rs::parse"
contract = "Strictly validates text as the role's answer via the generated types: one JSON object, no surrounding text, no duplicate or unknown fields, snake_case enums. Errors are FieldError {field, problem, example} naming the field path and an example at it. Needs no BAML native library."

[[interface]]
id = "prepare-baml-env"
anchor = "src/llm.rs::prepare_baml_env"
contract = "Unsafe, call before threads exist: sets BAML_LIBRARY_DISABLE_DOWNLOAD unless STEWARDS_BAML_DOWNLOAD is set, sets BAML_LOG=off unless BAML_LOG is set, removes every BOUNDARY_* variable."

[[interface]]
id = "direct-guards"
anchor = "src/llm.rs::direct_guards"
contract = "Checks, in order: [models.direct] <role> is <provider>/<model> with provider anthropic|openai|google-ai (else no_direct_model), the provider's API key env var is non-blank (else no_api_key), the BAML native library loads (else baml_runtime_unavailable). Returns (provider, model, key)."

[[interface]]
id = "direct-call"
anchor = "src/llm.rs::direct"
contract = "After direct_guards, calls the role's BAML function with a ClientRegistry client carrying the explicit model and api_key, and returns the typed answer serialized as JSON text. Any BAML error becomes the fixed direct_call_failed error, never echoing the brief, reply, or provider response."

[[interface]]
id = "schema-freshness"
anchor = "tests/llm.rs::generated_client_and_rendered_text_match_baml_src"
contract = "src/baml_client embeds every baml_src file verbatim, llm_sources.sha256 matches baml_src/*.baml plus src/llm_schema/*.txt, and every generated enum has the on_generate snake_case rename. Refresh: baml-cli generate, then the ignored llm::tests::refresh_llm_schema."

