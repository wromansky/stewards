[doc]
overview = "The setup unit is how a repository gets onto stewards and how the generated files stay true. It proposes units for a repo and writes .stewards, writes the stewards block into AGENTS.md, tells every agent harness the same way to delegate, and renders human documentation pages from the unit cards. A reader meets it as three commands, init, guide and docs, plus the harness table that guide and init draw on."
how_it_works = "Plain init (src/init.rs, propose) refuses with already_initialized if units.toml or repo.toml exists. Otherwise it proposes units from manifest roots, source directories and co-change history, naming the repo after its origin URL's last segment, else its directory. Test commands come from what each directory directly holds (dir_tests): the repo-wide commands only from the repo root, and a unit's own command (unit_test) from its dir/** paths, skipped when the root covers its toolchain or its directories disagree, written to the unit's test card. It writes both files and those cards, appends missing .gitignore lines, upserts the AGENTS.md block, and reports, ending with the AGENTS.md-only note. init --draft (draft_jobs) runs only step 1 on an uninitialized repo, then briefs an architect job plus a first review per never-reviewed unit with handoffs, and says to run review --roles until it exits 0; --direct checks every model guard first, then submits each job, a failure reporting how many were submitted. --hooks and --ci return not_implemented. src/guide.rs holds the block: upsert_block writes it at the top of AGENTS.md or replaces the text between the markers, returning whether the file changed. guide prints the block's paragraphs, roles, adoption and AGENTS.md-only text, and one delegation text for every harness; --all, --errors and --glossary add every harness, the error table and the glossary. src/harness.rs: detect returns the first harness whose verified env prefix matches; by_name looks one up case-insensitively, else harness_unknown. src/docs.rs (pages) renders docs_path/<unit>.md plus README.md from cards, escaping text, linking live anchors, rejecting a bad docs_path or unknown unit, writing only changed files."
how_to_change = "Start from the file for the command: src/init.rs for proposing units, test commands and draft jobs, src/guide.rs for the AGENTS.md block and guide text, src/harness.rs for per-harness facts, src/docs.rs for rendered pages. Each has a test file in tests/ (init.rs, init_draft.rs, guide.rs, docs.rs); change the test with the behavior. Keep true what the contracts promise: plain init never overwrites an initialized repo; the repo-wide test command comes only from the root and a unit's from its own directories; init --draft only runs on an uninitialized repo and checks every model guard before any --direct call; the .gitignore step only appends and never duplicates a line in another spelling; upsert_block stays idempotent and touches only its markers' text; stewards writes only AGENTS.md and gives every harness the same delegation text; a harness is only detected when its env rule is verified; docs refuses an empty or escaping docs_path and rewrites only changed files. Look up the repo, its cards and a unit through the shared helpers. Keep the card's interface table in step when a contract changes."
