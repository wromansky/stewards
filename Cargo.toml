[package]
name = "stewards"
version = "0.1.0"
edition = "2024"
description = "A team of agents that already knows your repo, for any coding-agent harness"
license = "MIT"
repository = "https://github.com/wromansky/stewards"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
