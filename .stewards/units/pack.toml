[[interface]]
id = "pack"
anchor = "src/pack.rs::pack"
contract = "Builds the role's pack fitted to its repo.toml budget. Architect: no unit, all unit summaries, flows, decisions. Others need a unit; developer is a usage error naming brief. --diff after a live stamp: changed files and hunks; with none: all owned files. [pack] exclude files are named, never inlined."

[[interface]]
id = "developer"
anchor = "src/pack.rs::developer"
contract = "developer(repo, unit, task, n, dev_task, snapshot) builds the developer pack for task n: purpose, paths, interface, gaps, the unit's flows, the task (n, title, change, files, check), and only the card anchors whose path is in the task's files."

[[interface]]
id = "render"
anchor = "src/pack.rs::render"
contract = "Pack::render returns the --human markdown whose byte length the budget measures. Free text is one_line'd, table-escaped, or fenced longer than its longest backtick run, so it cannot open a block. A first review lists at most 200 owned files plus a count; JSON keeps all."

[[interface]]
id = "fit"
anchor = "src/pack.rs::fit"
contract = "Pack::fit shrinks until render fits, in order: halve source windows, drop sources last-first, gaps, flows, a first review's owned files, truncate hunks to 40 lines; each step logged in dropped. Purpose, interface, task, scenarios, bug, hunk paths are never dropped; else over_budget."

[[interface]]
id = "run"
anchor = "src/pack.rs::run"
contract = "`stewards pack [unit] --role <role> [--diff] [--task <text>]` emits the pack (JSON, or markdown with --human) for the current repo at its snapshot; task defaults to git::task_text."

