[package]
name = "stewards"
version = "0.1.0"
edition = "2024"
description = "A team of agents that already knows your repo, for any coding-agent harness"
license = "MIT"
repository = "https://github.com/wromansky/stewards"
readme = "README.md"
include = ["/src/", "/baml_src/", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/licenses/", "/README.md"]

[dependencies]
anyhow = "1.0.104"
baml = "=0.226.3"
baml-sys = "=0.226.3"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
globset = "0.4.21"
libc = "0.2"
libloading = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
toml = "1.2.1"
toml_edit = "0.25.19"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-hcl = "1.1.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-language = "0.1.9"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"

[dev-dependencies]
tempfile = "3.27.0"
