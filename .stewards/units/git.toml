[[gap]]
kind = "gap"
title = "recent_commit_files hides every rev-parse failure as 'no commits'"
anchor = "src/git.rs::recent_commit_files"
note = "It returns empty on any rev-parse error (e.g. outside a repo), unlike head_commit which errors; reusing head_commit would separate 'no commits' from real failures."

[[gap]]
kind = "gap"
title = "recent_commit_files returns C-quoted names for paths with special characters"
anchor = "src/git.rs::recent_commit_files"
note = "log --name-only is not -z, so names containing newline, tab, quote or backslash come back C-quoted and will not match ls_files paths."

[[gap]]
kind = "bug"
title = 'origin_url returns Some("origin") when the origin url is empty'
anchor = "src/git.rs::origin_url"
note = "git remote get-url prints the remote name when remote.origin.url is set to an empty string, so the empty filter never fires and the contract's 'None when it is empty' is broken."
repro = "cargo test --test git origin_url_is_none_when_the_url_is_empty -- --include-ignored"
severity = "low"

[doc]
overview = "The git unit is the one place in the program that talks to git. It shells out to the git CLI and returns plain Rust values: the tracked files, a tree sha standing for the current working tree, the (path, blob sha) pairs in a tree, yes/no answers about whether a name is a tree, the paths, text, added lines and hunk ranges of a diff between two trees, the text of a blob, the HEAD commit, the origin remote URL, the task text built from the branch and last commit subject, and the files touched by recent commits. Callers ask what the repository looks like now and what changed between two points without knowing any git command lines. It never touches the real index, HEAD or refs."
how_it_works = "Everything goes through two private helpers in src/git.rs. run_raw starts git in the repo root with core.quotepath off, so paths are raw UTF-8, and can point git at another index file via GIT_INDEX_FILE. run turns a non-zero exit into an error carrying the command and stderr. Listings such as ls_files use NUL-separated output. snapshot finds the real index with rev-parse --git-path (so linked worktrees work), creates a uniquely named temp file with create_new, copies the index into it with the real index's mtime (or read-tree --empty when none exists), runs add -A and write-tree there, and returns the tree sha; a drop guard deletes the temp file. ls_tree, has_object and is_tree inspect trees; a leading-dash name is an error in ls_tree and false in the checks. diff_names and diff_file compare two revs; diff_file matches its path literally. diff_added_lines and diff_hunks share a private -U0 diff (diff_u0) and parse it the same way: new_path reads each +++ b/ line, hunk_sides reads the @@ header into (start, count) pairs for each side. diff_added_lines yields (path, new line number, text); diff_hunks yields (path, old range, new range) per hunk, where a count of 0 means no lines on that side. Both skip C-quoted names; diff_hunks also has none for deleted or binary files. blob_text reads a blob by sha with cat-file. head_commit, origin_url, task_text and recent_commit_files are as in the contract table. Tests are in tests/git.rs."
how_to_change = "Start in src/git.rs and add or change a function there, going through run or run_raw rather than spawning Command directly, so the quotepath setting and error format stay the same. Keep these true: snapshot must never modify the real index, HEAD or refs, must keep the real index's mtime on its copy, must refuse a pre-existing temp path, and must work with no commits and in linked worktrees; revs and names starting with a dash must stay errors or false, never read as git options (diff and cat-file calls pass --end-of-options); diff_file must treat its path literally; diff_added_lines and diff_hunks must keep agreeing on which files they skip, since both use diff_u0 and new_path; head_commit returns None only before the first commit; origin_url stays None, not an error, without an origin. The contract table lists the behaviours to preserve; when you change one, update the matching test in tests/git.rs and this document. diff_hunks and blob_text are not yet in the card's interface table."
