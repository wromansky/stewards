unit = "next"

[[scenario]]
id = "never-stamped-units-get-only-maintainer-and-validator-jobs"
interface = "next"
given = "single fixture: store has an interface, no docs and a bug gap; api's interface file counts as changed; neither unit has a [reviewed] stamp"
expect = "jobs are api maintainer, store maintainer, store validator; no tester or documenter job; exit 1"
level = "integration"
command = "cargo test --test next never_stamped_units_get_only_maintainer_and_validator_jobs"

[[scenario]]
id = "interface-body-edit-gives-maintainer-tester-documenter"
interface = "next"
given = "single fixture, both units stamped; the body of store's save_item changes in src/store/db.py (count_items in the same file untouched)"
expect = "jobs are store maintainer, tester, documenter; tester and documenter reasons are 'interface changed: src/store/db.py::save_item' and changed is src/store/db.py"
level = "integration"
command = "cargo test --test next interface_body_edit_gives_maintainer_tester_documenter"

[[scenario]]
id = "private-function-edit-in-an-interface-file-gives-only-a-maintainer-job"
interface = "next"
given = "stamped store; an edit to a non-interface function in the same file as an interface"
expect = "only a store maintainer job; no tester or documenter job"
level = "integration"
command = "cargo test --test next private_function_edit_in_an_interface_file_gives_only_a_maintainer_job"

[[scenario]]
id = "interface-without-findable-lines-falls-back-to-the-file-trigger"
interface = "next"
given = "stamped unit whose interface name was removed from its file, or sits in a file added since the mark"
expect = "tester and documenter jobs fire with reason 'interface file changed'"
level = "integration"
command = "cargo test --test next interface_name_removed_from_its_file_falls_back_to_the_file_trigger"

[[scenario]]
id = "plain-next-folds-stamped-units-into-one-reviewer-job"
interface = "next"
given = "two stamped units whose interfaces changed; plain `next --no-brief`"
expect = "one job, role reviewer, empty unit, command 'stewards brief --role reviewer'; its reasons are every maintainer/tester/documenter reason of `next --roles` led by the unit name; architect false; exit 1"
level = "integration"
command = "cargo test --test review next_lists_one_reviewer_job_naming_each_due_unit_and_why"

[[scenario]]
id = "never-stamped-unit-keeps-its-maintainer-job-beside-the-review"
interface = "next"
given = "api stamped and changed, store never stamped; plain `next --no-brief`"
expect = "jobs are the reviewer job then store maintainer; exit 1"
level = "integration"
command = "cargo test --test review a_never_stamped_unit_keeps_its_maintainer_job_beside_the_review"

[[scenario]]
id = "a-written-brief-carries-a-safe-handoff"
interface = "next_run"
given = "workspace whose repo directory name is prose that reads like an instruction, or contains a backtick; briefs written with --roles"
expect = "job handoff is exactly 'Read `<brief_path>` and follow it.' with two backticks; a backtick in the path is refused with error unsafe_path, exit 2"
level = "integration"
command = "cargo test --test next a_workspace_repo_directory_name_cannot_steer_the_handoff"

[[scenario]]
id = "unowned-changed-file-keeps-next-from-done"
interface = "next_run"
given = "stamped units; a file no unit owns is added since the stamps; then it is listed in repo.toml unowned_ok"
expect = "next and review list it in unowned_changed and exit 1; once covered by unowned_ok they exit 0"
level = "integration"
command = "cargo test --test review a_file_added_since_the_stamps_that_no_unit_owns_keeps_review_and_next_from_done"
