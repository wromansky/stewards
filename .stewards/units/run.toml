[[interface]]
id = "run-allowed"
anchor = "src/run.rs::allowed"
contract = "The repo's commands.test entries (own timeout, else commands.timeout_seconds) plus the named unit's test_command only; never another unit's, never commands.lint."

[[interface]]
id = "run-check"
anchor = "src/run.rs::check"
contract = "Err if cmd has a SHELL_CHARS, control or invisible character, or does not start with all the words of an allowed entry; else the matching entry with the most words."

[[interface]]
id = "run-run"
anchor = "src/run.rs::run"
contract = "Refused: command_not_allowed error. Else runs argv, no shell, in its own process group, SIGKILLed at the timeout and after a normal exit; bare name via absolute PATH only. Returns pass, timed_out, exit_code, output tail."

[[interface]]
id = "run-shell-chars"
anchor = "src/run.rs::SHELL_CHARS"
contract = "Characters a command may not contain; submit's command_not_allowed example uses it."

