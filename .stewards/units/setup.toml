title = "guide paragraphs are picked by index from BLOCK"
anchor = "src/guide.rs::BLOCK.split"
note = "guide run splits BLOCK on blank lines and takes parts[2..=5]; adding or removing a paragraph in the block silently shifts which text each guide field shows."

[[gap]]
kind = "gap"
title = "six harnesses are never detected from env"
anchor = "src/harness.rs::EnvRule::Unverified"
note = "Harnesses with an unverified env rule are only reachable through guide --harness; detect and telemetry fall back to generic for them."

[[gap]]
kind = "gap"
title = "Last reviewed commit is written at line start"
anchor = "src/docs.rs::unit_page"
note = "esc assumes a tool-written prefix, but unit_page writes reviewed.commit alone on its line and the commit is not validated; a hand-edited commit like `1. x` or `---` renders as a list or rule. Cosmetic only: no HTML or link can form."

[doc]
overview = "The setup unit is how a repository gets onto stewards and how the generated files stay true. It proposes units for a repo and writes .stewards, writes the stewards block into AGENTS.md, tells every agent harness the same way to delegate, writes the CI template for the origin's forge, and renders human documentation pages from the unit cards. A reader meets it as init, guide and docs, plus the harness table that guide and init draw on."
how_it_works = "Plain init (src/init.rs, propose) refuses with already_initialized if units.toml or repo.toml exists. Otherwise it proposes units from manifest roots, source directories and co-change history, naming the repo after its origin URL's last segment, else its directory. Test commands come from what each directory directly holds (dir_tests): repo-wide only from the root, a unit's own (unit_test) from its dir/** paths, skipped when the root covers its toolchain or its directories disagree. It writes both files and the test cards, appends missing .gitignore lines, upserts the AGENTS.md block, and reports, ending with the AGENTS.md-only note. init --draft (draft_jobs) runs only step 1 on an uninitialized repo, briefs an architect job plus a first review per never-reviewed unit, and says to run review --roles until it exits 0; --direct checks every model guard first. init --ci (write_ci) needs an initialized repo with an origin: it picks the forge from the origin host, writes .github/workflows/stewards.yml or .gitlab/stewards.yml pinned to this version (a file with other content is refused, a rerun is a no-op), and adds the path to unowned_ok in repo.toml through toml_edit unless a unit, a tool or unowned_ok covers it. --hooks and render are cut from 0.1.0. src/guide.rs: upsert_block writes the block at the top of AGENTS.md or between its markers; guide prints its paragraphs and one delegation text for every harness. src/harness.rs: detect and by_name. src/docs.rs (pages) renders docs_path pages from cards."
how_to_change = "Start from the file for the command: src/init.rs for proposing units, test commands, draft jobs and the CI templates, src/guide.rs for the AGENTS.md block and guide text, src/harness.rs for per-harness facts, src/docs.rs for rendered pages. Each has a test file in tests/ (init.rs, init_draft.rs, guide.rs, docs.rs); change the test with the behavior. Keep true what the contracts promise: plain init never overwrites an initialized repo; the repo-wide test command comes only from the root and a unit's from its own directories; init --draft only runs on an uninitialized repo and checks every model guard before any --direct call; init --ci never overwrites a CI file with other content and keeps repo.toml's comments; the .gitignore step only appends and never duplicates a line in another spelling; upsert_block stays idempotent; stewards writes only AGENTS.md and gives every harness the same delegation text; a harness is only detected when its env rule is verified; docs refuses an empty or escaping docs_path and rewrites only changed files. Keep the card's interface table in step when a contract changes."
