[doc]
overview = "The setup unit is how a repository gets onto stewards and how the generated files stay true. It proposes units for a repo and writes .stewards, writes the stewards block into AGENTS.md, tells every agent harness the same way to delegate, and renders human documentation pages from the unit cards. A reader meets it as three commands, init, guide and docs, plus the harness table that guide and init draw on."
how_it_works = "Plain init (src/init.rs, propose) refuses with already_initialized if units.toml or repo.toml exists. Otherwise it proposes units from manifest roots, source directories and co-change history, naming the repo after its origin remote (the last URL segment without .git), else its directory. It writes both files, appends the missing .gitignore lines (a line with or without a leading or trailing slash counts as present), upserts the AGENTS.md block, and reports what it wrote, ending with the AGENTS.md-only note: a harness that does not read AGENTS.md needs a line in its own instruction file pointing at it, listed as instruction_files in repo.toml so check can warn. init --draft (draft_jobs) runs only that first step on an uninitialized repo, then briefs one architect job plus a first review per never-reviewed unit, each with its handoff, and ends telling to run review --roles until it exits 0. With --direct it checks every model guard first, then submits each job; a failure reports how many were submitted. init --hooks and --ci return not_implemented. src/guide.rs holds the block: upsert_block writes it at the top of AGENTS.md (creating it) or replaces the text between the markers, returning whether the file changed. guide's run prints the block's ritual, handoff, editing and hygiene paragraphs, the roles, adoption and AGENTS.md-only text, and one delegation text that is the same for every harness, named, detected or unknown. --all, --errors and --glossary add every harness, the error table and the glossary. src/harness.rs holds the facts table: detect returns the first harness whose env var prefix matches (an unverified rule is never detected), by_name looks one up case-insensitively, failing with harness_unknown and the valid names. src/docs.rs (pages) renders docs_path/<unit>.md per unit plus README.md from cards, tests and repo.toml, escaping card text, linking live anchors, rejecting an empty or escaping docs_path and an unknown unit, writing only changed files."
how_to_change = "Start from the file for the command: src/init.rs for proposing units and draft jobs, src/guide.rs for the AGENTS.md block and guide text, src/harness.rs for per-harness facts, src/docs.rs for rendered pages. Each has a test file in tests/ (init.rs, init_draft.rs, guide.rs, docs.rs); change the test with the behavior. Keep true what the contracts promise: plain init never overwrites an initialized repo; init --draft only runs on an uninitialized repo and checks every model guard before any --direct call; the .gitignore step only appends and never duplicates a line already there in another spelling; upsert_block stays idempotent and touches only the text between its markers; stewards writes only AGENTS.md and names no harness's instruction file, command line or subagent tool, so every harness gets the same delegation text; a harness is only detected when its env rule is verified, and an unknown name stays harness_unknown with the valid names; docs refuses a docs_path that is empty or escapes the repo and rewrites only changed files. Look up the repo, its cards and a unit through the shared helpers rather than writing a local copy. Keep the card's interface table in step when a contract changes."
