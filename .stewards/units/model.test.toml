unit = "model"

[[scenario]]
id = "loaded-card-empty-when-missing"
interface = "loaded-unit"
given = "a loaded repo where unit api has a card file and unit store has none"
expect = 'Loaded::card("api") returns the stored card; Loaded::card("store") returns an empty card named store (no stamp, interface, anchors, gaps or doc) without adding it to Loaded.cards'
level = "integration"
command = "cargo test --test workspace loaded_card_returns_the_stored_card_or_an_empty_one"

[[scenario]]
id = "load-repo-rejects-non-plain-instruction-file"
interface = "load-repo"
given = 'repo.toml lists instruction_files = ["/etc/passwd"], ["../x.md"], ["a/../x.md"] or ["./x.md"]'
expect = "stewards check exits 2 with error code unsafe_path"
level = "integration"
command = "cargo test --test check an_unsafe_instruction_file_path_is_rejected_on_load"
