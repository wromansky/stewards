[[interface]]
id = "next"
anchor = "src/next.rs::next"
contract = "Roles: maintainer if stale/unreviewed; stamped only: tester (interface lines or test file changed since mark), documenter (interface lines or no docs); validator per unjudged bug; architect if 2+ stamped moved. Else: one reviewer job per repo folding stamped units' reasons, plus first reviews."

[[interface]]
id = "next_run"
anchor = "src/next.rs::run"
contract = "`stewards next`: lists the reviewer job and first reviews, or with --roles every per-role job; no --pr; writes briefs unless --no-brief; exits 0 only with no jobs, no check failures and no changed unowned file outside unowned_ok."

[[interface]]
id = "status"
anchor = "src/status.rs::status"
contract = "Per unit of each initialized repo: freshness (fresh/stale/unreviewed by fingerprint), interfaces, interfaces covered by a scenario, non-bug gaps, bugs, and debt count; the stamp_claim text saying what a stamp claims; uninitialized repos listed apart; workspace names carry the repo prefix."

[[interface]]
id = "status_run"
anchor = "src/status.rs::run"
contract = "`stewards status`: always exits 0; with --telemetry adds the current repo's telemetry summary, or null with no current repo."

[[interface]]
id = "review_due"
anchor = "src/next.rs::review_due"
contract = "For one repo: the snapshot, the task (given or from git), and the stamped units with a maintainer (stale), tester or documenter job, in units.toml order, each with its deduplicated reasons."

