[[interface]]
id = "eval_run"
anchor = "src/eval/mod.rs::run"
contract = "`stewards eval`: pi and claude-code (others not_implemented); claude-code runs at thinking off and refuses --max-cost; arms default to bare, block-only, full (full-no-developers with --no-developers); unknown arm, suite, task: usage error; --setup-dir refused for a repo suite; exit 0 only on pass."

[[interface]]
id = "execute"
anchor = "src/eval/mod.rs::execute"
contract = "Reads every task prompt first, then runs sequentially: clone and build, full setup, per task, per run, each arm in a fresh copy with the driver's context_file committed; a timed-out run's tokens are null; writes runs/*.json, summary.json, summary.md; stops before a session over --max-cost."

[[interface]]
id = "driver"
anchor = "src/eval/mod.rs::Driver"
contract = "A harness: `start` runs one session in a fresh environment (fresh_session_env) and waits for end or timeout; `parse` turns its transcript into a Run, tolerating a truncated last line only if truncation_ok; `context_file` names a file the runner commits beside AGENTS.md (none by default)."

[[interface]]
id = "pi_parse"
anchor = "src/eval/pi.rs::parse"
contract = "One Pi session tree to a Run: main vs total tokens, cache refreshes apart, each record counted once by (id, timestamp), cost from usage.cost.total, files opened per session cwd, models and thinking levels, child reviewer submits, failed child stops; more than one top-level file is an error."

[[interface]]
id = "pi_agent_dir"
anchor = "src/eval/pi.rs::agent_dir"
contract = "Writes an isolated Pi agent dir: settings with only npm:pi-subagents and every child at the given thinking level, auth.json linked, models-store.json copied, npm/ linked; never writes the user's dir; error when pi-subagents is not installed."

[[interface]]
id = "suite_load"
anchor = "src/eval/suite.rs::load"
contract = "Loads evals/suites/<name>.toml (fixture or repo source, tasks with read_only, setup, files_opened_vs_bare); an unknown name is a usage error listing the valid ones; unknown fields are rejected."

[[interface]]
id = "grade_task"
anchor = "src/eval/grade.rs::grade_task"
contract = "A compared run not ok, without transcript, or never started makes the task incomplete; else read-only is n/a and an edit task passes only when every full run has no gate_misses; overhead ratios never change the verdict."

[[interface]]
id = "gate_misses"
anchor = "src/eval/grade.rs::gate_misses"
contract = "What one full run of an edit task misses: changed, a `stewards review` ran, a subagent was given a handoff, and the runner's next --no-brief exited 0. Empty when it passes."

[[interface]]
id = "suite_verdict"
anchor = "src/eval/grade.rs::suite_verdict"
contract = "Fail when any task fails, else incomplete when any task is or there are none, else pass."

[[interface]]
id = "ritual_steps"
anchor = "src/eval/mod.rs::ritual_steps"
contract = "From actions: status/route/next/review are stewards commands in any session; handoff is a subagent launch holding a handoff (is_handoff) of a brief; handoff_exact that every such launch gives each child exactly a handoff; reviewer_submit is a child's submit --role reviewer; check_green left false."

[[interface]]
id = "stewards_commands"
anchor = "src/eval/mod.rs::stewards_commands"
contract = "The stewards commands of a shell line: each separator-split segment whose program is stewards (after VAR=value words), from the subcommand on, global flags and -C/--repo values skipped."

[[interface]]
id = "shell_reads"
anchor = "src/eval/mod.rs::shell_reads"
contract = "Paths simple read commands (cat, head, tail, sed, grep, rg, ...) name, skipping option values, patterns, quoted separators, variables and heredoc bodies; relative paths joined to a leading cd dir."

[[interface]]
id = "existing_files"
anchor = "src/eval/mod.rs::existing_files"
contract = "The regular files among opened paths, in order and distinct; a last-component glob is expanded against the listing (dot names only by a dot pattern); directories and missing paths dropped."

[[interface]]
id = "reviewed_units"
anchor = "src/eval/mod.rs::reviewed_units"
contract = "Units, verdicts and finding counts from a reviewer submit's JSON output; None for any other output."

[[interface]]
id = "would_exceed"
anchor = "src/eval/mod.rs::would_exceed"
contract = "True when spent plus the mean cost so far is over max; false with no cost known, so the first session always runs."

[[interface]]
id = "without_developers"
anchor = "src/eval/mod.rs::without_developers"
contract = "AGENTS.md with the developer Changing line cut to its first sentence; an error when that line is absent."

[[interface]]
id = "path_without_stewards"
anchor = "src/eval/mod.rs::path_without_stewards"
contract = "PATH with each directory holding stewards replaced by a mirror linking everything else in it."

[[interface]]
id = "next_check"
anchor = "src/eval/mod.rs::next_check"
contract = "Runs stewards next --no-brief in a dir: exit code and job count; writes no briefs."

[[interface]]
id = "kill_leftovers"
anchor = "src/eval/mod.rs::kill_leftovers"
contract = "Kills every process whose cwd is under dir until none remain or 10 s pass; reports killed and survivors; None without /proc."

[[interface]]
id = "claude_parse"
anchor = "src/eval/claude.rs::parse"
contract = "A Claude Code session file plus its stdout.log to a Run: main tokens from result.usage, total from summed modelUsage, both null without a result line; cost_usd null, its figure kept as harness_reported_cost_usd; Read/Grep/Glob/Bash reads per record cwd; thinking on/off; sidechain children."

[[interface]]
id = "claude_config_dir"
anchor = "src/eval/claude.rs::config_dir"
contract = "Writes an isolated Claude Code config dir: settings.json with only the user's model, .credentials.json linked when present; never writes the user's dir; returns a plain note and the user's model."

[[interface]]
id = "task_prompt"
anchor = "src/eval/mod.rs::task_prompt"
contract = "The task file <dir>/NN-* verbatim; an error when none; a usage error when it contains `think` in any case."

