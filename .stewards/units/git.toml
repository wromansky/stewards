[[gap]]
kind = "gap"
title = "recent_commit_files hides every rev-parse failure as 'no commits'"
anchor = "src/git.rs::recent_commit_files"
note = "It returns empty on any rev-parse error (e.g. outside a repo), unlike head_commit which errors; reusing head_commit would separate 'no commits' from real failures."

[[gap]]
kind = "gap"
title = "recent_commit_files returns C-quoted names for paths with special characters"
anchor = "src/git.rs::recent_commit_files"
note = "log --name-only is not -z, so names containing newline, tab, quote or backslash come back C-quoted and will not match ls_files paths."

[[gap]]
kind = "bug"
title = 'origin_url returns Some("origin") when the origin url is empty'
anchor = "src/git.rs::origin_url"
note = "git remote get-url prints the remote name when remote.origin.url is set to an empty string, so the empty filter never fires and the contract's 'None when it is empty' is broken."
repro = "cargo test --test git origin_url_is_none_when_the_url_is_empty -- --include-ignored"
severity = "low"

[doc]
overview = "The git unit is the one place in the program that talks to git. It shells out to the git CLI and hands back plain Rust values: the list of tracked files, a tree sha that stands for the current working tree, the (path, blob sha) pairs inside a tree, yes/no answers about whether a name is a tree, the paths and text of a diff between two trees, the HEAD commit, the URL of the origin remote, the task text built from the branch and last commit subject, and the files touched by recent commits. Callers use it to ask what the repository looks like now and what changed between two points, without knowing any git command lines. It does not touch the real index, HEAD or refs."
how_it_works = "Everything goes through two private helpers in src/git.rs. run_raw starts `git` in the repo root with core.quotepath turned off, so paths come back as raw UTF-8, and it can point git at another index file through GIT_INDEX_FILE. run wraps it and turns a non-zero exit into an error carrying the command and git's stderr. Listing functions such as ls_files use NUL-separated output and split it on NUL. snapshot is the involved one: it finds the real index with rev-parse --git-path (so linked worktrees work), creates a uniquely named temp file with create_new so it never reuses an existing path, copies the real index into it and gives the copy the real index's mtime so git does not misjudge a same-second edit as unchanged, or starts from read-tree --empty when there is no index yet. It then runs add -A and write-tree against that private index and returns the tree sha; a drop guard deletes the temp file. ls_tree, has_object and is_tree inspect a tree: a leading-dash name is an error in ls_tree and false in the two checks, has_object accepts a tree or a commit's tree, and is_tree accepts only a tree itself. diff_names, diff_file and diff_added_lines compare two revs; diff_file matches its path literally, and diff_added_lines reports added lines with their new-file line number and skips C-quoted paths. head_commit returns None before the first commit, origin_url returns the origin remote's URL or None when there is no origin (init uses it to name the repo), task_text gives the branch (HEAD when detached) and the last commit subject on the next line, and recent_commit_files lists files per commit, newest first, with merges listing none. The tests live in tests/git.rs."
how_to_change = "Start in src/git.rs and add or change a function there, going through run or run_raw rather than spawning Command directly, so the quotepath setting and error format stay the same. Keep these true: snapshot must never modify the real index, HEAD or refs, must keep the real index's mtime on its copy, must refuse a pre-existing temp path, and must work with no commits and in linked worktrees; revs and names that start with a dash must stay errors or false rather than being read as git options; diff_file must treat its path literally; head_commit must return None only for the no-commits case and an error for any other failure; origin_url must stay None, not an error, when there is no origin. The contract table is the list of behaviours to preserve, so when you change one, update the matching test in tests/git.rs, which covers this unit, and this document."
