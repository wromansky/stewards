[[interface]]
id = "brief-header"
anchor = "src/brief.rs::read_header"
contract = "A brief's first line is `<!-- stewards-job {json Header} -->`; a missing file or unparseable header is `no_brief`."

[[interface]]
id = "brief-path"
anchor = "src/brief.rs::rel_path"
contract = "Briefs live at `.stewards/briefs/<unit>-<role>-<snap>.md` (`architect-<snap>.md`, `review-<snap>.md`; developer `<unit>-developer-<n>-<snap>.md`, n from 1), <snap> the snapshot's first 8 hex chars. Answer and result files swap `.md` for `.answer.json` / `.result.json`."

[[interface]]
id = "brief-write"
anchor = "src/brief.rs::write_text"
contract = "Writing a brief removes its stale `.answer.json` and the job's briefs and answers at other snapshots (result files stay); a developer brief run also removes job files past the task list's end."

[[interface]]
id = "brief-build"
anchor = "src/brief.rs::build"
contract = "Packs and frames a role's brief; `unsafe_path` for a repo root with a backtick, control, line-separator or invisible char; a validator brief with no unjudged bug is `usage`."

[[interface]]
id = "submit-file"
anchor = "src/submit.rs::submit_file"
contract = "Needs a known unit (none for architect, reviewer); an answer file named as a job file of this job picks the brief at that snapshot, else the job's one brief; the header must match unit, role, task, tree id and brief name; answer <=256 KiB; retires, logs telemetry, writes .result.json."

[[interface]]
id = "anchor-name-bare"
anchor = "src/submit.rs::spaced_name"
contract = "An anchor name holding whitespace (`fn create_item`) in a card patch's interface, anchors or gaps, or an architect flow entry, is `answer_parse_failed` on that field instead of `answer_dead_anchor`."

[[interface]]
id = "write-and-retire"
anchor = "src/submit.rs::write_remove_and_retire"
contract = "Refuses link paths and returns `card_changed` before any write when a checked file changed since it was recorded; writes in order, then removes the brief, naming already-written files on a later failure."

[[interface]]
id = "telemetry-append"
anchor = "src/telemetry.rs::append"
contract = "Appends one JSON line per submit to `.stewards/telemetry/<yyyy-mm>.jsonl`: sizes and counts only."

[[interface]]
id = "telemetry-summary"
anchor = "src/telemetry.rs::summary"
contract = "Per-role submit counts and mean pack bytes plus total pulled anchors; null with no telemetry files; unreadable files and lines are skipped, never an error."

[[interface]]
id = "card-patch"
anchor = "src/submit.rs::apply_patch"
contract = "card_patch upserts interface by id, anchors by path::name, gaps by title (keeping severity and issue); unnamed entries stay, in order. Only remove_* lists remove; a removal naming a key the card lacks or the patch also upserts is `answer_parse_failed`."

[[interface]]
id = "tester-bug"
anchor = "src/submit.rs::apply_bugs"
contract = "A tester bug upserts a bug gap by title with its repro and evidence, keeping severity and issue; its anchor is the named interface's anchor, else the gap's. A new title on a known bug's anchor is not added; the summary names it a possible duplicate."

[[interface]]
id = "documenter-index"
anchor = "src/submit.rs::documenter"
contract = "Writes the unit's card, its doc page and the docs index; the index (`docs/units/README.md`) is left out of the lost-update check, the card and page are checked."

[[interface]]
id = "review-brief"
anchor = "src/brief.rs::build_review"
contract = "One reviewer brief for the due units (units.toml order) that fit the review budget; its header lists them, the rest are named as next round; the text asks the answer to copy its snapshot."

[[interface]]
id = "review-submit"
anchor = "src/submit.rs::reviewer"
contract = "The answer's snapshot must match the header's (else no_brief) and give each header unit once, checked as its maintainer, tester and documenter answers are; nothing is written on any error. approve stamps at the snapshot with tester and documenter marks; changes writes the fix task."

[[interface]]
id = "brief-handoff"
anchor = "src/brief.rs::handoff"
contract = "The one sentence for a brief at an absolute path, the same for every role and every command that writes a brief: Read `<path>` and follow it. A path check_root refuses is `unsafe_path`."

[[interface]]
id = "job-name"
anchor = "src/brief.rs::job_of"
contract = "Reads unit, role, task n and snap back from a brief, answer or result file name, only when rel_path builds exactly that name; any other name is None."

[[interface]]
id = "command-allowlist"
anchor = "src/submit.rs::allowlist"
contract = "A scenario command, repro or task check must start with a commands.test entry or the unit's own test card test_command, never another unit's; an architect flow check gets commands.test only."

[[interface]]
id = "answer-too-long"
anchor = "src/submit.rs::check_text"
contract = "A field over its cap is answer_too_long giving its length, how far over the cap it is, the cap and a target at 80% of the cap; the fix says a length-only rejection does not count toward the three tries."

[[interface]]
id = "first-review"
anchor = "src/submit.rs::check_first_review"
contract = "A maintainer review of a never-stamped unit (no reviewed block) is rejected as answer_parse_failed on `verdict` for `changes` and on `findings[i]` for any finding; problems go in card_patch.gaps and the verdict is approve. The brief for it leads with brief::FIRST_REVIEW."

