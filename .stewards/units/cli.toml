[[interface]]
id = "json-envelope"
anchor = "src/output.rs::emit"
contract = "Every command prints one JSON object on stdout: `stewards: {version, schema: 1}` flattened with the payload; --human prints `Human::render` instead. A closed pipe is dropped silently, other write errors go to stderr; returns whether all was written."

[[interface]]
id = "cli-error"
anchor = "src/output.rs::CliError"
contract = "A failed command prints the envelope with `error: {code, message, fix}` (+ `errors` when non-empty) on stdout and exits 2; --human prints `error:` and `fix:` lines plus one line per field error. A non-CliError prints as code `internal`."

[[interface]]
id = "usage-errors"
anchor = "src/main.rs::main"
contract = "Clap parse failures (missing or unknown args) and a `-C` dir that cannot be entered are CliError code `usage`, exit 2, JSON unless --human appears in argv; --help and --version print clap's text and exit normally."

[[interface]]
id = "global-flags"
anchor = "src/main.rs::Cli"
contract = "--human, --repo <name>, -C <dir> and --direct are accepted before or after any subcommand; -C changes the working directory before dispatch; --direct is also set by STEWARDS_DIRECT=1."

[[interface]]
id = "not-implemented"
anchor = "src/output.rs::not_implemented"
contract = "Unbuilt flags (validate --export, review --pr, next --pr, init --ci) parse and then fail with CliError code `not_implemented`, exit 2; render and the init --hooks flag no longer exist and are usage errors."

[[interface]]
id = "review-command"
anchor = "src/review.rs::run"
contract = "`review [--task] [--roles] [--answer ...]` records answers, shows up to 20 result files per call as reported, lists due jobs unless findings, files or unowned changes remain; then line adds failing checks and open plans; exit 0 only when done."

[[interface]]
id = "completions-man"
anchor = "src/completions.rs::run"
contract = "`completions <bash|zsh|fish|elvish|powershell>` and `man` print the script or roff page raw on stdout (not enveloped; closed pipe dropped quietly) and a `save it: ...` hint on stderr, exit 0; an unknown shell is a usage error."

[[interface]]
id = "validate-report"
anchor = "src/validate.rs::run"
contract = "`validate --report <file>` takes one JSON bug, applies the tester's bug checks, records it on the card, runs the repro through the allowlisted runner, writes the validator brief with the result; a duplicate writes no brief."

