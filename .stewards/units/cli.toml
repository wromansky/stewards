[doc]
overview = "The cli unit is the stewards binary itself: the part a person or an agent actually runs. It parses the command line with clap, hands each subcommand to the unit that implements it, and makes every command answer in one predictable shape. By default a command prints a single JSON object on stdout, wrapped in an envelope that carries the stewards version and a schema number of 1 beside the command's own fields. With --human it prints the markdown rendering instead. When a command fails it prints the same envelope with an error holding a code, a message and a fix, and the process exits 2. The unit also owns the global flags (--human, --repo <name>, -C <dir>, --direct), the validate stub, the forge seam (src/forge.rs) that posts a PR or MR comment through gh or glab, and the shared test helpers."
how_it_works = "Everything starts in src/main.rs. Cli declares the four global flags, accepted before or after any subcommand, and a Command enum with one variant per subcommand. --help or --version prints clap's text and exits normally; any other parse failure is a CliError code usage, JSON unless --human is in argv, exit 2. After a good parse main builds a Global, changes directory for -C, and dispatch calls the owning module's run. completions and man print raw text (not enveloped); validate is a stub returning not_implemented. src/review.rs runs stewards review: it records each --answer, keeps --task, reads up to 20 untracked result files, shows each as reported not verified, and lists due jobs unless findings or files remain; it removes the files once its output is written and exits 0 only when nothing is left. With --pr <n> it posts that report (verdicts, findings, notes, jobs, then line) as one PR/MR comment through forge::post, after the report is built and before it is emitted; a failure sets pr_comment_error and never changes the exit code. src/forge.rs picks gh or glab from the origin host (github.com, gitlab.com, or a host a CLI is logged in to), calls the CLI with --hostname and the repo path from origin, finds its own comment by author and marker and edits it in place, fences the text with each line indented and caps the body at 65000 bytes. src/output.rs holds emit (enveloped JSON or --human; a closed pipe is dropped) and CliError. Tests: tests/skeleton.rs, tests/forge.rs (a recorded-response Fake CLI), tests/review.rs, helpers in tests/common/mod.rs."
how_to_change = "To add or change a command, start in src/main.rs: add the variant and flags to Command, add its arm to dispatch, and put the work in a module declared in src/lib.rs whose run takes &Global and returns anyhow::Result<ExitCode>. Give the payload Serialize and Human implementations and print it with emit, so JSON and --human stay in step; do not write to stdout yourself (only completions and man print raw text, through write_stdout in src/completions.rs). Report failures as a CliError with a stable code and a concrete fix; main turns it into the envelope and exit 2. To post to a forge, call forge::post (or post_comment with the Fake CLI in tests); never read a PR title or body, keep userinfo out of messages, and report a post failure in the payload, not the exit code. To build validate, replace its not_implemented call with a real run and add tests. Keep true: one JSON object on stdout with the stewards version and schema 1; errors with code, message, fix, exit 2, JSON unless --human is in argv even for parse failures; --help and --version exit normally; global flags accepted anywhere; -C applied before dispatch; STEWARDS_DIRECT=1 equal to --direct. If the envelope shape changes in a way readers would notice, bump the schema number in output.rs. Check changes against tests/skeleton.rs and the other integration tests."
