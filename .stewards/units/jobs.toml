[[gap]]
kind = "future"
title = "unchanged check and writes are not atomic"
anchor = "src/submit.rs::write_remove_and_retire"
note = "A concurrent submit writing between check_unchanged and the writes is still lost; marked simplified: in code, a lock file would close it."

[doc]
overview = "The jobs unit is the hand-off between the tool and the agent that does a piece of work. The tool writes a brief for one role on one unit (or for the architect, who has no unit), or one reviewer brief covering every unit a change touched; the agent answers in typed JSON, and submitting that answer checks it against the brief, writes the resulting updates, and retires the brief. The brief carries the answer schema, with each field's length cap stated in it, and tells the agent that a field over its cap is rejected. Where the answer carries a card patch, submit also applies it to the unit's card: each list updates entries by key, and only the explicit remove lists delete. Each submit leaves one line of telemetry, so you can see how large the packs were and how many anchors agents had to open. It lives in src/brief.rs, src/submit.rs and src/telemetry.rs."
how_it_works = "Building a brief packs and frames a role's context (build in src/brief.rs; build_review for the reviewer, whose header lists the units it covers and whose text asks the answer to copy its snapshot). It refuses an unsafe repo root (unsafe_path), and a validator brief with no unjudged bug is a usage error. The brief goes to .stewards/briefs/<unit>-<role>.md (architect.md, review.md; <unit>-developer-<n>.md, n from 1) through rel_path. Its first line is a JSON header that read_header parses; a missing file or bad header is no_brief. Submit (submit_file in src/submit.rs) checks the unit, the header and the answer file, then runs the role's handler. A text field over its cap is answer_too_long. check_patch validates a card patch before any write, and apply_patch upserts interface by id, anchors by path and name, gaps by title, then applies the remove lists. The reviewer's handler checks each unit with the maintainer, tester and documenter checks (check_review, check_scenarios, check_bugs, check_doc), writes nothing on any error, and per unit stamps an approval or writes a changes verdict's fix task. Writes go through write_remove_and_retire, which refuses link paths and returns card_changed before any write if a checked file changed; it writes in order, then removes the brief. Finally src/telemetry.rs appends one JSON line of sizes and counts; a failure only warns."
how_to_change = "Start in src/brief.rs for what a brief says or where it lives, and in src/submit.rs for what an answer must satisfy or what a submit writes. Keep the header line format and the brief path scheme in step, because submit finds the brief by path and trusts the header to match. Build a job path only through rel_path. Print brief text only through emit. Keep the caps the schema states in step with the caps check_text enforces. Keep write_remove_and_retire checking for changed files and link paths before it writes, and the brief removal last, so a failed submit leaves the brief to retry. A check a role's handler makes belongs in a shared function the reviewer calls too, so a review answer is held to the same rules. For card patches, an entry leaves the card only by a remove list that check_patch has checked. Keep telemetry to sizes and counts, never content, and never let it fail a submit. The tests are tests/brief.rs, tests/submit.rs, tests/submit_roles.rs, tests/developer.rs and tests/review.rs; for a change to what a brief contains, assert on the rendered brief text."
