[[gap]]
kind = "gap"
title = "Reader threads outlive a held-open pipe"
anchor = "src/run.rs::run"
note = "A process that left the group and holds stdout/stderr open leaves the two reader threads running after run returns (the wait for them is 1s each); output after that is lost."

[[gap]]
kind = "gap"
title = "Streams share one buffer without order guarantee"
anchor = "src/run.rs::run"
note = "stdout and stderr chunks are appended in read order, so interleaving of the two streams is approximate; a signalled child has exit_code None."

[[gap]]
kind = "future"
title = "run::run has no caller yet"
anchor = "src/run.rs::run"
note = "Only run::allowed and run::check are used (by submit); later tasks add the callers of run::run."

[doc]
overview = "run is the one place a command may start. allowed builds the allowlist: the repo's commands.test entries (each with its own timeout, else commands.timeout_seconds) plus the named unit's test_command, never another unit's and never commands.lint. check is the gate every agent-written command passes (submit applies it to scenarios, repros, tasks and flow checks): no SHELL_CHARS, no control or invisible character, and the leading words must be all the words of an allowed entry. The words after that prefix are not checked: the allowlist limits which program starts, not what it does. run refuses what check refuses, and otherwise executes it."
how_it_works = "run splits the command on whitespace, finds a bare program name only through the absolute entries of PATH (a name that is not found is a failed result), and spawns it without a shell from the repo root, stdin null, env inherited, in its own process group. Two threads drain stdout and stderr into one capped buffer so a full pipe cannot block the child. The parent polls the leader with waitid(WNOWAIT) every 50ms, which does not reap it, so the group id cannot be reused. At the entry's timeout, and also after a normal exit, it SIGKILLs the whole group and then reaps the leader, so background children die; a process that left the group is not killed. An error while polling kills and reaps the child before it is returned. Output keeps the last 4000 characters, control characters turned to spaces and invisible characters escaped. A timeout (with a command_timeout line appended) or a program that cannot start is a failed RunResult; only a refused command is an error, command_not_allowed. Readers are waited for 1s each after exit, so a process that left the group and holds a pipe open cannot hang run."
how_to_change = "Keep check the single gate: a new caller of run goes through run::run or run::check, never Command directly with an agent-written string. Widening SHELL_CHARS, the control and invisible rule, or the prefix rule changes what submit accepts, so update submit's command_not_allowed example and its tests too. A change to timeout or kill behaviour is checked by a_timeout_kills_the_whole_process_group_and_is_a_result and a_process_a_command_leaves_behind_is_killed_after_a_normal_exit in tests/run.rs; a change to program lookup by a_program_is_never_found_through_a_relative_path_entry. commands.lint stays out of allowed."
