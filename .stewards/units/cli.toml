[doc]
overview = "The cli unit is the stewards binary itself: the part a person or an agent actually runs. It parses the command line with clap, hands each subcommand to the unit that implements it, and makes every command answer in one predictable shape. By default a command prints a single JSON object on stdout, wrapped in an envelope that carries the stewards version and a schema number of 1 beside the command's own fields. With --human it prints the markdown rendering instead. When a command fails it prints the same envelope with an error holding a code, a message and a fix, and the process exits 2. The unit also owns the global flags (--human, --repo <name>, -C <dir>, --direct), the stub commands that are parsed but not built yet, and the shared helpers the integration tests use."
how_it_works = "Everything starts in src/main.rs. The Cli struct declares the four global flags, which clap accepts before or after any subcommand, and a Command enum with one variant per subcommand. main tries to parse. A request for --help or --version prints clap's own text and exits normally. Any other parse failure becomes a CliError with code usage, printed as JSON unless --human appears in argv, and exits 2. After a good parse main builds a Global value (human, repo, direct). Direct is true if --direct is given or STEWARDS_DIRECT is set to 1. If -C was given, main changes the working directory before anything else runs, and a directory it cannot enter is also a usage error. Then dispatch matches the Command and calls the run function of the owning module, parsing --role strings into a Role on the way. Modules in lib.rs do the real work; the files in this unit that are not main.rs and output.rs (completions, eval, render, review, validate) are stubs that parse their flags and return not_implemented, a CliError with code not_implemented. src/output.rs defines the pieces every command shares. emit prints a payload either as the enveloped JSON or, with --human, through the payload's Human::render. CliError carries code, message, fix and, for a failed submit, a list of field errors that is only serialised when non-empty. CliError::emit wraps it in an error payload; the human form prints an error: line, a fix: line and one line per field error. Back in main, an error that is a CliError is emitted as is, and any other error is emitted with code internal and the fix 'report a bug'; both exit 2. Tests live in tests/skeleton.rs, with shared helpers in tests/common/mod.rs such as fixture, run (which returns the exit code and the parsed JSON) and stewards."
how_to_change = "To add or change a command, start in src/main.rs: add the variant and its flags to the Command enum, add its arm to dispatch, and put the work in a module declared in src/lib.rs whose run takes &Global and returns anyhow::Result<ExitCode>. Give the payload type Serialize and Human implementations and print it with emit, so that JSON and --human stay in step. Report failures by returning a CliError with a stable code and a concrete fix; the main loop turns it into the envelope and exit 2, so do not print errors or exit yourself. To build one of the stubs, replace its not_implemented call with a real run and add its tests; the interface promises those commands fail with not_implemented until then. Keep true the things callers depend on: one JSON object on stdout with the stewards version and schema 1 fields flattened with the payload; errors with code, message and fix, exit 2, and JSON unless --human is in argv even for parse failures; --help and --version exiting normally; global flags accepted anywhere on the line; -C applied before dispatch; and STEWARDS_DIRECT=1 equal to --direct. If the envelope shape changes in a way readers would notice, bump the schema number in output.rs. Check changes against tests/skeleton.rs and the other integration tests, which use the helpers in tests/common."
