unit = "cli"

[[scenario]]
id = "emit-closed-pipe"
interface = "json-envelope"
given = "`stewards route` with 3000 paths (JSON and --human) and `stewards brief api --role maintainer --task <120 KB> --stdout`, whose stdout reader closes after one byte"
expect = "no panic on stderr, exit code 0; a broken pipe is dropped quietly"
level = "integration"
command = "cargo test --test skeleton output_into_a_pipe_closed_early_does_not_panic"

[[scenario]]
id = "review-done"
interface = "review-command"
given = "a repo with nothing due"
expect = "stewards review prints then: done, no jobs, exit 0"
level = "integration"
command = "cargo test --test review review_with_nothing_due_is_done_and_exits_0"

[[scenario]]
id = "review-findings-block-jobs"
interface = "review-command"
given = "a result file reporting a finding"
expect = "the finding is shown as reported, no jobs are listed, exit 1; after the fix the unit is listed again"
level = "integration"
command = "cargo test --test review review_reports_findings_until_they_are_fixed_then_lists_the_unit_again"

[[scenario]]
id = "review-removes-after-write"
interface = "review-command"
given = "result files and a stdout closed before the output is written"
expect = "the result files stay for the next call"
level = "integration"
command = "cargo test --test review results_are_removed_only_after_the_output_is_written"

[[scenario]]
id = "review-answer-contested"
interface = "review-command"
given = "a finding answered with `review --answer`, which the next reviewer contests"
expect = "the finding comes back blocking with the contest, a second --answer for it is a usage error; an accepted answer lets the unit stamp"
level = "integration"
command = "cargo test --test review a_contested_answer_comes_back_blocking_and_cannot_be_answered_again"

[[scenario]]
id = "review-notes-do-not-block"
interface = "review-command"
given = "a review approving a unit with only non-blocking findings"
expect = "the notes are printed and recorded, the unit stamps, no fix task is written"
level = "integration"
command = "cargo test --test review an_approval_with_only_notes_stamps_and_writes_no_fix_task"

[[scenario]]
id = "completions-scripts"
interface = "completions-man"
given = "stewards completions for each of the five shells, and stewards man"
expect = "exit 0, script or `.TH stewards 1` page on stdout, `save it: stewards ... > ` on stderr"
level = "integration"
command = "cargo test --test completions every_shell_prints_a_script_naming_review_and_a_save_hint"
