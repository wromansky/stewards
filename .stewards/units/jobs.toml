title = "unchanged check and writes are not atomic"
anchor = "src/submit.rs::write_remove_and_retire"
note = "A concurrent submit writing between check_unchanged and the writes is still lost; marked simplified: in code, a lock file would close it."

[doc]
overview = "The jobs unit is the hand-off between the tool and the agent that does a piece of work. The tool writes a brief for one role on one unit (or for the architect, who has no unit), the agent answers in typed JSON, and submitting that answer checks it against the brief, writes the resulting updates, and retires the brief. Each submit also leaves one line of telemetry, so you can see how large the packs were and how many anchors agents had to open. It lives in src/brief.rs, src/submit.rs and src/telemetry.rs."
how_it_works = "Building a brief packs the role's context and frames it (build in src/brief.rs). It refuses a repo root containing control or line-separator characters with unsafe_path, and a validator brief with no unjudged bug is a usage error. The brief is written to .stewards/briefs/<unit>-<role>.md (architect.md for the architect, <unit>-developer-<n>.md for developers, n counting from 1). Its first line is a comment of the form stewards-job followed by a JSON header, which read_header parses later; a missing file or an unparseable header counts as no_brief. Writing a brief deletes any stale .answer.json beside it, and a developer run also deletes job files past the end of the task list. Submit (submit_file in src/submit.rs) requires a known unit (none for the architect), a header whose unit, role, task number and full tree id match, and an answer file that is a regular file of at most 256 KiB. It then runs the role's handler. The handler writes through write_remove_and_retire, which refuses link paths and returns card_changed before any write if a checked file changed since it was recorded. It writes in order, then removes the brief; if a later write fails, the error names the files already written. Finally src/telemetry.rs appends one JSON line, sizes and counts only, to .stewards/telemetry/<yyyy-mm>.jsonl. A telemetry failure is only a warning. The summary function reports per-role submit counts, mean pack bytes and total pulled anchors, returns null when there are no telemetry files, and skips unreadable files and lines."
how_to_change = "Start in src/brief.rs for what a brief says or where it lives, and in src/submit.rs for what an answer must satisfy or what a submit writes. Keep the header line format and the brief path scheme in step with each other, because submit finds the brief by path and trusts the header to match unit, role, task and tree id. Keep write_remove_and_retire checking for changed files and link paths before it writes anything, and keep the brief removal last, so a failed submit leaves the brief to retry. Keep telemetry to sizes and counts, never content, and never let it fail a submit. The tests are tests/brief.rs, tests/submit.rs, tests/submit_roles.rs and tests/developer.rs. Add the case to the one matching the file you changed, and for a change to what a brief names or contains, assert on the rendered brief text in tests/brief.rs."
