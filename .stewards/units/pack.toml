[doc]
overview = "The pack unit builds the context a role is handed before it starts work: unit summaries, anchors with windows of source, the unit's owned files, and diff hunks. Everything has to fit a byte budget set per role in repo.toml, so the reader gets the most useful slice of the repo that fits. It is exposed as the pack command, which prints JSON or, with --human, markdown. The architect gets no single unit but every unit's summary plus flows and decisions. Every other role needs a unit. The developer role is the exception: it is built from a task of the maintainer's plan, not through the plain pack command."
how_it_works = "The pack command (run) takes an optional unit, a role, an optional --diff and an optional task text, defaulting to git::task_text, and emits the pack for the current repo at its snapshot. It calls pack, which assembles the role's pack. After a live stamp, --diff yields the changed files and their hunks. With no stamp it is a first review and lists all owned files. Files named in the [pack] exclude list are named but never inlined. For the developer role, asking through pack is a usage error that points to brief. The developer function builds that pack for task n instead: purpose, paths, interface, gaps, the unit's flows, the task itself (number, title, change, files, check), and only the card anchors whose path is in the task's files. Budget is measured on the rendered markdown. render produces it, with free text collapsed to one line, escaped in tables, or fenced longer than its longest backtick run so it cannot open a block. A first review lists at most 200 owned files plus a count, while JSON keeps all of them. If the render is too big, fit shrinks it in a fixed order: halve source windows, drop sources last-first, drop gaps, drop flows, drop a first review's owned files, then truncate hunks to 40 lines. Each step is logged in dropped. Purpose, interface, task, scenarios, bug and hunk paths are never dropped, and if the pack still does not fit it is reported as over_budget."
how_to_change = "Start in src/pack.rs: pack for what a role receives, developer for the developer pack, render for the markdown form, fit for the shrink order, and run for the command's arguments. Tests live in tests/pack.rs. Keep the budget honest: fit must measure the same render the --human output uses, so any new section needs both a render path and a place in the drop order, unless it belongs with the never-dropped content. Keep free text escaped or fenced in render so repository text cannot open a block or act as instructions. Keep excluded files named and not inlined, keep the 200-file listing cap in markdown with JSON carrying everything, and keep every drop recorded in dropped. If you change what the architect or a first review lists, update the matching test in tests/pack.rs and the card's contracts."
