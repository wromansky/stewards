[[interface]]
id = "pack"
anchor = "src/pack.rs::pack"
contract = "Builds the role's pack fitted to its repo.toml budget. Architect: no unit, all unit summaries, flows, decisions. Others need a unit; developer is a usage error naming brief. --diff after a live stamp: changed files and hunks; with none: all owned files. [pack] exclude files are named, never inlined."

[[interface]]
id = "developer"
anchor = "src/pack.rs::developer"
contract = "developer(repo, unit, task, n, dev_task, snapshot) builds the developer pack for task n: purpose, paths, interface, gaps, the unit's flows, the task (n, title, change, files, check), and only the card anchors whose path is in the task's files."

[[interface]]
id = "render"
anchor = "src/pack.rs::render"
contract = "Pack::render returns the --human markdown the budget measures; an anchor header shows `source from line N`. Free text is one_line'd, table-escaped or fenced longer than its backtick run. A first review lists at most 200 owned files plus a count; JSON keeps all."

[[interface]]
id = "fit"
anchor = "src/pack.rs::fit"
contract = "Pack::fit shrinks until render fits: halve source windows, drop sources last-first, gaps, known bugs, flows, first review's owned files, cut hunks to 40 lines; logged in dropped. Never dropped: purpose, interface, task, scenarios, bug, answered, hunk paths."

[[interface]]
id = "run"
anchor = "src/pack.rs::run"
contract = "`stewards pack [unit] --role <role> [--diff] [--task <text>]` emits the pack (JSON, or --human markdown) at the snapshot. --role reviewer takes no unit (usage error) and emits the round of review packs for the units due."

[[interface]]
id = "review"
anchor = "src/pack.rs::review"
contract = "review(repo, due, task, snapshot) returns a ReviewRound: each due unit's reviewer section, in order, grouped so a group fits REVIEW_BUDGET; one that does not starts the next group, none deferred. A lone oversize unit is squeezed."

