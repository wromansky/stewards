[[interface]]
id = "eval_run"
anchor = "src/eval/mod.rs::run"
contract = "`stewards eval`: pi, claude-code and hermes (others not_implemented); claude-code runs at thinking off; --max-cost refused for every harness but pi; hermes needs --model provider/model; arms default to bare, block-only, full; unknown arm, suite, task: usage error; exit 0 only on pass."

[[interface]]
id = "execute"
anchor = "src/eval/mod.rs::execute"
contract = "Reads every task prompt first, then runs sequentially per task, run and arm in a fresh copy; a timed-out or interrupted run's tokens are null; a SIGINT/SIGTERM stops the session, records it failed (interrupted), writes the summary and returns an interrupted error."

[[interface]]
id = "driver"
anchor = "src/eval/mod.rs::Driver"
contract = "A harness: `start` runs one session in a fresh environment and waits; `parse` turns its transcript into a Run; `context_file` names a file committed beside AGENTS.md; `credential_files` names linked credentials the runner redacts."

[[interface]]
id = "pi_parse"
anchor = "src/eval/pi.rs::parse"
contract = "One Pi session tree to a Run: main vs total tokens, cost, files opened per cwd, models, thinking, child reviewer submits, plan_stored (child architect submit printed `plan <id> stored`), failed child stops; >1 top-level file is an error."

[[interface]]
id = "pi_agent_dir"
anchor = "src/eval/pi.rs::agent_dir"
contract = "Writes an isolated Pi agent dir: settings with only npm:pi-subagents and every child at the given thinking level, auth.json linked, models-store.json copied, npm/ linked; never writes the user's dir; error when pi-subagents is not installed."

[[interface]]
id = "suite_load"
anchor = "src/eval/suite.rs::load"
contract = "Loads evals/suites/<name>.toml (sources, absent probes, tasks with read_only, setup, files_opened_vs_bare, repro, expects_plan); a repro with no repro.sh or an unknown name is a usage error; unknown fields rejected."

[[interface]]
id = "grade_task"
anchor = "src/eval/grade.rs::grade_task"
contract = "A compared run not ok, without transcript, or never started: incomplete; else read-only is n/a and an edit task passes only when every full run has no gate_misses; overhead, bug_fixed and plan counts are report-only."

[[interface]]
id = "gate_misses"
anchor = "src/eval/grade.rs::gate_misses"
contract = "What one full run of an edit task misses: changed, a `stewards review` ran, a subagent was given a handoff, and the runner's next --no-brief --no-run exited 0. Empty when it passes."

[[interface]]
id = "suite_verdict"
anchor = "src/eval/grade.rs::suite_verdict"
contract = "Fail when any task fails, else incomplete when any task is or there are none, else pass."

[[interface]]
id = "ritual_steps"
anchor = "src/eval/mod.rs::ritual_steps"
contract = "From actions: status/route/next/review are stewards commands in any session; handoff is a subagent launch holding a handoff (is_handoff) of a brief; handoff_exact that every such launch gives each child exactly a handoff; reviewer_submit is a child's submit --role reviewer; check_green left false."

[[interface]]
id = "stewards_commands"
anchor = "src/eval/mod.rs::stewards_commands"
contract = "The stewards commands of a shell line: each separator-split segment whose program is stewards (after VAR=value words), from the subcommand on, global flags and -C/--repo values skipped."

[[interface]]
id = "shell_reads"
anchor = "src/eval/mod.rs::shell_reads"
contract = "Paths simple read commands (cat, head, tail, sed, grep, rg, ...) name, skipping option values, patterns, quoted separators, variables and heredoc bodies; relative paths joined to a leading cd dir."

[[interface]]
id = "existing_files"
anchor = "src/eval/mod.rs::existing_files"
contract = "The regular files among opened paths, in order and distinct; a last-component glob is expanded against the listing (dot names only by a dot pattern); directories and missing paths dropped."

[[interface]]
id = "reviewed_units"
anchor = "src/eval/mod.rs::reviewed_units"
contract = "Units, verdicts and counts of blocking findings (contested ones included), notes and contested findings from a reviewer submit's JSON output; None for any other output."

[[interface]]
id = "would_exceed"
anchor = "src/eval/mod.rs::would_exceed"
contract = "True when spent plus the mean cost so far is over max; false with no cost known, so the first session always runs."

[[interface]]
id = "without_developers"
anchor = "src/eval/mod.rs::without_developers"
contract = "AGENTS.md with the developer Changing line cut to its first sentence; an error when that line is absent."

[[interface]]
id = "path_without_stewards"
anchor = "src/eval/mod.rs::path_without_stewards"
contract = "PATH with each directory holding stewards replaced by a mirror linking everything else in it."

[[interface]]
id = "next_check"
anchor = "src/eval/mod.rs::next_check"
contract = "Runs stewards next --no-brief --no-run in a dir: exit code and job count; writes no briefs, runs no commands."

[[interface]]
id = "kill_leftovers"
anchor = "src/eval/mod.rs::kill_leftovers"
contract = "Kills every process whose cwd is under dir, or whose HERMES_HOME (no other variable) is under it, until none remain or 10 s pass; reports killed and survivors. Lists via /proc on Linux, lsof and ps -E on macOS; None where it cannot list."

[[interface]]
id = "claude_parse"
anchor = "src/eval/claude.rs::parse"
contract = "A Claude Code session file (keep_transcript appends its subagents/agent-*.jsonl) plus stdout.log to a Run: tokens from the result line, null without; cost_usd null; reads per record cwd; children grouped by agentId, else parent chain; launch is Agent (Task before)."

[[interface]]
id = "claude_config_dir"
anchor = "src/eval/claude.rs::config_dir"
contract = "Writes an isolated Claude Code config dir: settings.json with the user's model, .credentials.json linked. Without one (macOS) sessions run in the user's own dir with --setting-sources project,local --strict-mcp-config; returns a note and model."

[[interface]]
id = "task_prompt"
anchor = "src/eval/mod.rs::task_prompt"
contract = "The task file <dir>/NN-* verbatim; an error when none; a usage error when it contains `think` in any case."

[[interface]]
id = "pinned_commit"
anchor = "src/eval/mod.rs::pinned_commit"
contract = "A repo suite's commit: HEAD is the evals/ checkout's commit, refused when src/, baml_src/ or .stewards/ have uncommitted changes; a sha as given; either refused when an absent probe's text is in its file there. Refusals are eval_setup_incomplete."

[[interface]]
id = "hermes_parse"
anchor = "src/eval/hermes.rs::parse"
contract = "A Hermes sessions export to a Run: the first-started top-level row is the task's, other top-level rows uncounted and flagged; only source subagent rows are children; a refused delegate_task launches nothing; peak context from agent.log or None; cost_usd null."

[[interface]]
id = "hermes_template"
anchor = "src/eval/hermes.rs::template"
contract = "Writes the eval's template Hermes home: config.yaml lifting the one-shot subagent cap and auto-approving children, .env linked, installs/ built; never writes the user's home; each session gets a fresh home linking it and its daemon is killed after."

[[interface]]
id = "eval_redact_secrets"
anchor = "src/eval/mod.rs::redact_secrets"
contract = "After each session, replaces every secret value (name holds key, token, secret, password, access or refresh; 8+ chars) of the driver's credential_files with [redacted] in every text file under the kept sessions dir at any depth and in the run record; links not followed."

[[interface]]
id = "answers_given"
anchor = "src/eval/mod.rs::answers_given"
contract = "How many findings a session's shell commands answered: each --answer of a stewards review command; recorded per full run, report-only."

[[interface]]
id = "eval_bug_fixed"
anchor = "src/eval/mod.rs::bug_fixed"
contract = "After each task-role session of a task naming a repro (every arm), runs evals/repros/<repro>/repro.sh with FIXTURE_ROOT=<run dir>; true when it exits 0 within 60 s; report-only."

[[interface]]
id = "eval_plan_outcome"
anchor = "src/eval/mod.rs::plan_outcome"
contract = "Stored is the run's plan_stored; closed is stored with no .stewards/plans/*.toml left in the run dir; recorded only for full runs of a task that expects_plan; report-only."

